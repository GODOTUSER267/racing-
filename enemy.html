<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hostile Sentinel — Web Viewer</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#05070a;
    font-family:'Courier New', monospace; }
  canvas { display:block; }
  #hud {
    position:fixed; top:16px; left:16px; color:#9fe3ff; font-size:13px;
    text-shadow:0 0 8px #0af; pointer-events:none; letter-spacing:1px; line-height:1.7;
  }
  #hud b { color:#ff3b2f; text-shadow:0 0 10px #ff3b2f; }
  #ui {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; z-index:10;
  }
  #ui button {
    background:rgba(10,20,30,.85); color:#7fd4ff; border:1px solid #1e5a7a;
    padding:9px 20px; font-family:inherit; font-size:12px; letter-spacing:2px;
    cursor:pointer; border-radius:3px; transition:.15s;
  }
  #ui button:hover { background:rgba(30,90,122,.6); color:#dff6ff; }
  #ui button.active {
    background:#ff2a1a; border-color:#ff2a1a; color:#fff;
    box-shadow:0 0 18px rgba(255,42,26,.7);
  }
</style>
</head>
<body>

<div id="hud">
  <div>&gt; ASSET: <b>HOSTILE_SENTINEL</b></div>
  <div>&gt; STATE: <span id="stateLabel">IDLE</span></div>
  <div>&gt; DRAG = ORBIT · SCROLL = ZOOM</div>
</div>

<div id="ui">
  <button data-state="idle" class="active">IDLE</button>
  <button data-state="walk">WALK</button>
  <button data-state="attack">ATTACK</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ SCENE ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070a);
scene.fog = new THREE.Fog(0x05070a, 8, 22);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.2, 1.7, 3.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.6;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.addEventListener('start', () => (controls.autoRotate = false));

/* ============ LIGHTS ============ */
scene.add(new THREE.HemisphereLight(0x3a4a5a, 0x000000, 0.45));

const key = new THREE.DirectionalLight(0xaaccee, 1.7);
key.position.set(4, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1;
key.shadow.camera.far = 22;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
scene.add(key);

const rim = new THREE.DirectionalLight(0xff3322, 1.5);
rim.position.set(-5, 2, -5);
scene.add(rim);

const fill = new THREE.PointLight(0x2266ff, 0.5, 15);
fill.position.set(0, 1.2, 4);
scene.add(fill);

/* ============ GROUND ============ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color: 0x0a0e14, roughness: 0.92, metalness: 0.25 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 40, 0x113344, 0x0a1a22);
grid.position.y = 0.002;
scene.add(grid);

/* ============ MATERIALS ============ */
const matArmor = new THREE.MeshStandardMaterial({ color:0x2a2f38, metalness:0.95, roughness:0.34 });
const matDark  = new THREE.MeshStandardMaterial({ color:0x12161c, metalness:0.75, roughness:0.5  });
const matJoint = new THREE.MeshStandardMaterial({ color:0x050608, metalness:0.35, roughness:0.85 });
const matGlow  = new THREE.MeshStandardMaterial({
  color:0xff2a1a, emissive:0xff2a1a, emissiveIntensity:5, metalness:0, roughness:0.25
});

/* ============ HELPERS ============ */
function part(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ============ ENEMY ROOT ============ */
const enemy = new THREE.Group();
enemy.position.y = -0.01;
scene.add(enemy);

/* ---- HIPS / PELVIS ---- */
const hips = new THREE.Group();
hips.position.y = 0.97;
enemy.add(hips);

hips.add(part(new THREE.BoxGeometry(0.36, 0.22, 0.24), matArmor));
hips.add(part(new THREE.BoxGeometry(0.42, 0.07, 0.28), matDark, 0, 0.11, 0));
hips.add(part(new THREE.BoxGeometry(0.10, 0.10, 0.10), matGlow, 0, 0, 0.14)); // back vent

/* ---- SPINE / TORSO ---- */
const spine = new THREE.Group();
spine.position.y = 0.12;
hips.add(spine);

spine.add(part(new THREE.BoxGeometry(0.28, 0.16, 0.20), matJoint, 0, 0.06, 0));
spine.add(part(new THREE.BoxGeometry(0.44, 0.34, 0.26), matArmor, 0, 0.26, 0));
spine.add(part(new THREE.BoxGeometry(0.48, 0.20, 0.31), matDark,  0, 0.32, -0.01));
spine.add(part(new THREE.BoxGeometry(0.40, 0.32, 0.06), matArmor, 0, 0.26, 0.16));

// glowing chest core
spine.add(part(new THREE.SphereGeometry(0.055, 14, 10), matGlow, 0, 0.32, -0.17));
const coreLight = new THREE.PointLight(0xff2a1a, 1.0, 2.5, 2);
coreLight.position.set(0, 0.32, -0.17);
spine.add(coreLight);

/* ---- NECK / HEAD ---- */
const neck = new THREE.Group();
neck.position.y = 0.44;
spine.add(neck);

neck.add(part(new THREE.CylinderGeometry(0.075, 0.09, 0.10, 10), matJoint, 0, 0.02, 0));

const head = new THREE.Group();
head.position.y = 0.12;
neck.add(head);

head.add(part(new THREE.BoxGeometry(0.26, 0.26, 0.30), matArmor));
head.add(part(new THREE.BoxGeometry(0.10, 0.10, 0.34), matDark, 0, 0.15, 0.02));   // crest
head.add(part(new THREE.BoxGeometry(0.26, 0.09, 0.06), matDark, 0, -0.05, -0.16)); // jaw
head.add(part(new THREE.BoxGeometry(0.24, 0.07, 0.05), matGlow, 0, 0.03, -0.155)); // visor

const visorLight = new THREE.PointLight(0xff2a1a, 1.4, 2.5, 2);
visorLight.position.set(0, 0.03, -0.25);
head.add(visorLight);

/* ---- ARMS ---- */
function buildArm(side) {
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.28, 0.30, 0);
  spine.add(shoulder);

  const pad = part(new THREE.SphereGeometry(0.13, 14, 10), matArmor, side * 0.02, 0.03, 0);
  pad.scale.set(1, 0.85, 1.05);
  shoulder.add(pad);

  shoulder.add(part(new THREE.CylinderGeometry(0.065, 0.055, 0.30, 10), matDark, 0, -0.16, 0));

  const elbow = new THREE.Group();
  elbow.position.y = -0.32;
  shoulder.add(elbow);
  elbow.add(part(new THREE.SphereGeometry(0.072, 12, 8), matJoint));

  elbow.add(part(new THREE.CylinderGeometry(0.055, 0.048, 0.30, 10), matArmor, 0, -0.16, 0));
  elbow.add(part(new THREE.BoxGeometry(0.11, 0.14, 0.09), matDark, 0, -0.13, -0.05)); // gauntlet

  const hand = new THREE.Group();
  hand.position.y = -0.32;
  elbow.add(hand);
  hand.add(part(new THREE.BoxGeometry(0.095, 0.13, 0.07), matJoint, 0, -0.06, 0));

  for (let i = 0; i < 3; i++) {
    hand.add(part(new THREE.BoxGeometry(0.022, 0.085, 0.022), matJoint,
      (i - 1) * 0.032, -0.165, -0.012));
  }
  hand.add(part(new THREE.BoxGeometry(0.022, 0.065, 0.022), matJoint, side * 0.052, -0.095, 0.015));

  return { shoulder, elbow, hand };
}

const armL = buildArm(-1);
const armR = buildArm(1);

/* ---- BLADE WEAPON (right hand) ---- */
const bladeGrp = new THREE.Group();
bladeGrp.position.set(0, -0.10, -0.02);
armR.hand.add(bladeGrp);
bladeGrp.add(part(new THREE.BoxGeometry(0.045, 0.72, 0.11), matArmor, 0, -0.42, -0.03));
bladeGrp.add(part(new THREE.BoxGeometry(0.13, 0.05, 0.15), matDark,  0, -0.06, -0.03)); // guard
bladeGrp.add(part(new THREE.ConeGeometry(0.045, 0.16, 4), matArmor, 0, -0.85, -0.03))
  .rotation.x = Math.PI;

/* ---- LEGS ---- */
function buildLeg(side) {
  const hip = new THREE.Group();
  hip.position.set(side * 0.13, 0, 0);
  hips.add(hip);
  hip.add(part(new THREE.SphereGeometry(0.082, 12, 8), matJoint));

  hip.add(part(new THREE.CylinderGeometry(0.088, 0.07, 0.44, 10), matArmor, 0, -0.22, 0));
  hip.add(part(new THREE.BoxGeometry(0.16, 0.20, 0.10), matDark, side * 0.06, -0.20, -0.03)); // thigh plate

  const knee = new THREE.Group();
  knee.position.y = -0.44;
  hip.add(knee);
  knee.add(part(new THREE.SphereGeometry(0.076, 12, 8), matJoint));
  knee.add(part(new THREE.BoxGeometry(0.14, 0.13, 0.07), matDark, 0, -0.02, -0.075)); // kneepad

  knee.add(part(new THREE.CylinderGeometry(0.066, 0.05, 0.44, 10), matDark, 0, -0.22, 0));

  const ankle = new THREE.Group();
  ankle.position.y = -0.44;
  knee.add(ankle);

  ankle.add(part(new THREE.BoxGeometry(0.13, 0.09, 0.26), matArmor, 0, -0.045, -0.06));
  ankle.add(part(new THREE.BoxGeometry(0.115, 0.06, 0.09), matJoint, 0, -0.06, -0.20));
  ankle.add(part(new THREE.BoxGeometry(0.11, 0.06, 0.08), matJoint, 0, -0.06, 0.06)); // heel

  return { hip, knee, ankle };
}

const legL = buildLeg(-1);
const legR = buildLeg(1);

/* ============ DUST PARTICLES ============ */
const DUST = 350;
const dustPos = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) {
  dustPos[i*3]     = (Math.random() - 0.5) * 24;
  dustPos[i*3 + 1] = Math.random() * 8;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 24;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0x88aacc, size: 0.028, transparent: true, opacity: 0.32, depthWrite: false
}));
scene.add(dust);

/* ============ POSE SYSTEM ============ */
const HIP_Y = 0.97;

function resetPose() {
  hips.position.set(0, HIP_Y, 0);
  hips.rotation.set(0, 0, 0);
  spine.rotation.set(0, 0, 0);
  neck.rotation.set(0, 0, 0);
  head.rotation.set(0, 0, 0);
  for (const a of [armL, armR]) {
    a.shoulder.rotation.set(0, 0, 0);
    a.elbow.rotation.set(0, 0, 0);
    a.hand.rotation.set(0, 0, 0);
  }
  for (const l of [legL, legR]) {
    l.hip.rotation.set(0, 0, 0);
    l.knee.rotation.set(0, 0, 0);
    l.ankle.rotation.set(0, 0, 0);
  }
}

/* ---------- IDLE : breathing + hostile scan ---------- */
function poseIdle(t) {
  const b = Math.sin(t * 1.5);

  hips.position.y = HIP_Y + b * 0.012;
  hips.rotation.z = Math.sin(t * 0.7) * 0.015;
  spine.rotation.x = 0.05 + b * 0.015;
  spine.rotation.y = Math.sin(t * 0.45) * 0.07;

  neck.rotation.y = Math.sin(t * 0.65) * 0.35;
  head.rotation.x = Math.sin(t * 0.9) * 0.05;

  // combat-ready stance
  armL.shoulder.rotation.x = 0.20 + b * 0.03;
  armL.shoulder.rotation.z = -0.17;
  armL.elbow.rotation.x = 0.55;
  armL.elbow.rotation.y = -0.22;

  armR.shoulder.rotation.x = 0.14 + b * 0.03;
  armR.shoulder.rotation.z = 0.17;
  armR.elbow.rotation.x = 0.42;
  armR.elbow.rotation.y = 0.22;

  legL.hip.rotation.z = -0.07;
  legR.hip.rotation.z = 0.07;
  legL.hip.rotation.x = -0.05;
  legR.hip.rotation.x = -0.05;
  legL.knee.rotation.x = -0.10;
  legR.knee.rotation.x = -0.10;
}

/* ---------- WALK : full gait cycle ---------- */
function poseWalk(t) {
  const p = t * 3.2;
  const s = Math.sin(p);

  hips.position.y = HIP_Y + Math.abs(Math.sin(p)) * 0.035 - 0.025;
  hips.rotation.y = s * 0.11;
  hips.rotation.z = s * 0.04;
  spine.rotation.x = 0.07;
  spine.rotation.y = -s * 0.11;
  neck.rotation.y = -s * 0.06;
  head.rotation.x = 0.02;

  // legs
  legL.hip.rotation.x = s * 0.55;
  legR.hip.rotation.x = -s * 0.55;
  legL.knee.rotation.x = -0.14 - 0.80 * Math.max(0, -s);
  legR.knee.rotation.x = -0.14 - 0.80 * Math.max(0,  s);
  legL.ankle.rotation.x = -legL.hip.rotation.x * 0.35;
  legR.ankle.rotation.x = -legR.hip.rotation.x * 0.35;

  // arms counter-swing
  armL.shoulder.rotation.x = -s * 0.45 + 0.06;
  armR.shoulder.rotation.x =  s * 0.45 + 0.06;
  armL.shoulder.rotation.z = -0.12;
  armR.shoulder.rotation.z =  0.12;
  armL.elbow.rotation.x = 0.50 + Math.max(0, -s) * 0.30;
  armR.elbow.rotation.x = 0.42 + Math.max(0,  s) * 0.30;
}

/* ---------- ATTACK : windup -> strike -> recover ---------- */
function poseAttack(u) {
  let armX, twist, lunge, kneeBend;

  if (u < 0.38) {                                  // WIND UP
    const e = Math.pow(u / 0.38, 2);
    armX = 0.15 - e * 1.35;
    twist = e * 0.55;
    lunge = -e * 0.04;
    kneeBend = e * 0.15;
  } else if (u < 0.62) {                            // STRIKE
    const k = (u - 0.38) / 0.24;
    const e = 1 - Math.pow(1 - k, 3);
    armX = -1.20 + e * 2.75;
    twist = 0.55 - e * 0.95;
    lunge = -0.04 + e * 0.20;
    kneeBend = 0.15 - e * 0.20;
  } else {                                          // RECOVER
    const k = (u - 0.62) / 0.38;
    const e = k * k;
    armX = 1.55 - e * 1.40;
    twist = -0.40 + e * 0.40;
    lunge = 0.16 - e * 0.16;
    kneeBend = -0.05 + e * 0.05;
  }

  const step = Math.max(0, lunge) * 3.0;
  const crouch = Math.abs(kneeBend) * 0.25;

  hips.position.y = HIP_Y - crouch + Math.abs(lunge) * 0.25;
  hips.position.z = lunge;
  hips.rotation.y = twist * 0.55;
  spine.rotation.x = 0.10 + Math.abs(lunge) * 0.5;
  spine.rotation.y = twist;

  neck.rotation.y = -twist * 0.4;
  head.rotation.x = 0.05;

  // right arm (blade)
  armR.shoulder.rotation.x = armX;
  armR.shoulder.rotation.z = 0.18 + Math.max(0, -armX) * 0.25;
  armR.elbow.rotation.x = Math.max(0.05, 0.9 - Math.abs(armX) * 0.55);
  armR.hand.rotation.x = -twist * 0.5;

  // left arm balances
  armL.shoulder.rotation.x = -armX * 0.35 + 0.25;
  armL.shoulder.rotation.z = -0.35 - Math.abs(twist) * 0.3;
  armL.elbow.rotation.x = 0.9;

  // legs
  legL.hip.rotation.x = -0.30 + step * 0.5;
  legR.hip.rotation.x =  0.22 - step * 0.7;
  legR.knee.rotation.x = -0.35 - kneeBend;
  legL.knee.rotation.x = -0.20 + kneeBend * 0.4;
  legL.ankle.rotation.x = 0.18;
}

/* ============ STATE MACHINE ============ */
const label = document.getElementById('stateLabel');
const buttons = [...document.querySelectorAll('#ui button')];

let state = 'idle';
let attackTime = 0;
let elapsed = 0;
const ATTACK_DUR = 0.85;

function setState(next) {
  state = next;
  if (next === 'attack') attackTime = 0;
  label.textContent = next.toUpperCase();
  buttons.forEach(b => b.classList.toggle('active', b.dataset.state === next));
}

buttons.forEach(b => b.addEventListener('click', () => {
  controls.autoRotate = false;
  setState(b.dataset.state);
}));

/* ============ LOOP ============ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  resetPose();

  if (state === 'idle') {
    poseIdle(elapsed);
  } else if (state === 'walk') {
    poseWalk(elapsed);
  } else if (state === 'attack') {
    attackTime += dt;
    const u = Math.min(attackTime / ATTACK_DUR, 1);
    poseAttack(u);
    if (u >= 1) setState('idle');
  }

  // emissive pulse
  const pulse = 4.2 + Math.sin(elapsed * 5.5) * 1.8;
  matGlow.emissiveIntensity = pulse;
  visorLight.intensity = 1.1 + Math.sin(elapsed * 5.5) * 0.55;
  coreLight.intensity  = 0.8 + Math.sin(elapsed * 4.0) * 0.4;

  // dust drift
  const dp = dust.geometry.attributes.position;
  for (let i = 0; i < DUST; i++) {
    let y = dp.getY(i) + dt * 0.15;
    if (y > 8) y = 0;
    dp.setY(i, y);
  }
  dp.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============ RESIZE ============ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============ KEYBOARD SHORTCUTS ============ */
addEventListener('keydown', e => {
  if (e.key === '1') setState('idle');
  if (e.key === '2') setState('walk');
  if (e.key === '3') setState('attack');
});
</script>
</body>
</html>
