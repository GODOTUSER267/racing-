<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hostile Sector — Omega</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#05070c;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#e6f2ff; user-select:none;
  }
  canvas { display:block; position:fixed; inset:0; z-index:0; }

  #crosshair {
    position:fixed; left:50%; top:50%; width:26px; height:26px; z-index:6;
    transform:translate(-50%,-50%); pointer-events:none; opacity:.9;
  }
  #crosshair i { position:absolute; background:#8ef7ff; box-shadow:0 0 6px #0cf; }
  #crosshair .t { left:50%; top:0;   width:2px; height:8px; margin-left:-1px; }
  #crosshair .b { left:50%; bottom:0;width:2px; height:8px; margin-left:-1px; }
  #crosshair .l { top:50%; left:0;   height:2px; width:8px; margin-top:-1px; }
  #crosshair .r { top:50%; right:0;  height:2px; width:8px; margin-top:-1px; }
  #crosshair .c { left:50%; top:50%; width:2px; height:2px; margin:-1px 0 0 -1px; background:#fff; }

  #hitmarker {
    position:fixed; left:50%; top:50%; width:30px; height:30px; z-index:7;
    transform:translate(-50%,-50%) rotate(45deg); opacity:0;
    pointer-events:none; transition:opacity .08s;
  }
  #hitmarker.show { opacity:1; }
  #hitmarker.crit i { background:#ffcc33 !important; box-shadow:0 0 10px #ff0 !important; }
  #hitmarker i { position:absolute; background:#ff5a5a; box-shadow:0 0 8px #f00; }
  #hitmarker .a { left:50%; top:0;  width:2px; height:11px; margin-left:-1px; }
  #hitmarker .b { left:50%; bottom:0;width:2px; height:11px; margin-left:-1px; }
  #hitmarker .c { top:50%; left:0;  height:2px; width:11px; margin-top:-1px; }
  #hitmarker .d { top:50%; right:0; height:2px; width:11px; margin-top:-1px; }

  #damage {
    position:fixed; inset:0; z-index:4; pointer-events:none; opacity:0;
    background: radial-gradient(ellipse at center, rgba(255,0,40,0) 35%, rgba(255,0,40,.75) 100%);
    transition:opacity .18s ease-out;
  }
  #lowhp {
    position:fixed; inset:0; z-index:3; pointer-events:none; opacity:0;
    box-shadow: inset 0 0 120px 30px rgba(255,0,30,.55);
    transition:opacity .35s ease-out;
  }

  #dmgdir { position:fixed; inset:0; z-index:5; pointer-events:none; }
  .dmg-arrow {
    position:absolute; width:56px; height:56px;
    left:50%; top:50%; margin:-28px 0 0 -28px;
    transition:opacity .35s ease-out;
  }
  .dmg-arrow::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(closest-side, rgba(255,60,60,.85), transparent 70%);
    clip-path: polygon(50% 0%, 100% 60%, 72% 60%, 72% 100%, 28% 100%, 28% 60%, 0% 60%);
  }

  #hud { position:fixed; inset:0; z-index:5; pointer-events:none; }

  #topbar {
    position:absolute; top:0; left:0; right:0; display:flex;
    justify-content:center; gap:36px; padding:14px 20px;
    background:linear-gradient(180deg, rgba(3,8,18,.85), transparent);
  }
  .stat { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .stat .k { font-size:9px; letter-spacing:.22em; opacity:.45; }
  .stat .v { font-size:19px; font-weight:700; color:#8ef7ff; text-shadow:0 0 12px #0af; }
  .stat .v.warn { color:#ff8080; text-shadow:0 0 12px #f33; }
  .stat .v.gold { color:#ffd166; text-shadow:0 0 12px #fa0; }

  #bossbar {
    position:absolute; top:78px; left:50%; transform:translateX(-50%);
    width:min(620px, 70vw); display:none; flex-direction:column; gap:5px;
  }
  #bossbar.show { display:flex; }
  #bossbar .lbl { font-size:11px; letter-spacing:.28em; color:#ff6688; text-align:center; text-shadow:0 0 10px #f24; }
  #bossbar .bar {
    height:16px; border:1px solid rgba(255,80,120,.55); border-radius:3px;
    background:rgba(0,0,0,.6); overflow:hidden; position:relative;
  }
  #bossbar .fill {
    height:100%; width:100%;
    background:linear-gradient(90deg, #ff2a55, #ff8a3d, #ff2a55);
    background-size:200% 100%;
    animation: bossflow 2s linear infinite;
    box-shadow:0 0 18px rgba(255,60,90,.75) inset;
    transition:width .2s ease-out;
  }
  @keyframes bossflow { to { background-position: -200% 0; } }

  #hpwrap { position:absolute; left:24px; bottom:24px; width:230px; }
  #hpwrap .lbl { font-size:10px; letter-spacing:.2em; opacity:.5; margin-bottom:6px; }
  #hpbar {
    height:14px; border:1px solid rgba(120,230,255,.35); border-radius:3px;
    background:rgba(0,0,0,.45); overflow:hidden; position:relative;
  }
  #hpfill {
    height:100%; width:100%; transition:width .16s ease-out;
    background:linear-gradient(90deg,#00e5a0,#4ff0ff);
    box-shadow:0 0 16px rgba(0,229,160,.75) inset;
  }
  #hpfill.low { background:linear-gradient(90deg,#ff2d55,#ff8a3d); box-shadow:0 0 16px rgba(255,45,85,.8) inset; }
  #hpnum {
    position:absolute; right:6px; top:-1px; font-size:11px; font-weight:700;
    color:#03131a; text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  #abilitywrap { display:flex; gap:8px; margin-top:10px; }
  .ability {
    padding:6px 10px; border:1px solid rgba(120,230,255,.28); border-radius:4px;
    background:rgba(0,0,0,.55); font-size:10px; letter-spacing:.1em;
    color:#8ef7ff; display:flex; align-items:center; gap:6px;
    opacity:.8;
  }
  .ability b { color:#ffe066; font-size:12px; }
  .ability.cd { opacity:.35; color:#666; }
  .ability.cd b { color:#666; }

  #ammowrap { position:absolute; right:26px; bottom:22px; text-align:right; min-width:180px; }
  #ammowrap .lbl { font-size:10px; letter-spacing:.2em; opacity:.5; margin-bottom:4px; }
  #wname { font-size:14px; font-weight:800; letter-spacing:.16em; color:#9be7ff; text-shadow:0 0 14px #0af; margin-bottom:2px; }
  #ammonum { font-size:34px; font-weight:800; color:#ffe066; text-shadow:0 0 18px rgba(255,180,0,.7); line-height:1; }
  #ammonum small { font-size:15px; opacity:.45; font-weight:600; }
  #reloadtxt { font-size:11px; letter-spacing:.18em; color:#ff9f43; height:14px; margin-top:4px; }

  #slots {
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px;
  }
  .slot {
    padding:7px 10px; border:1px solid rgba(120,230,255,.22); border-radius:4px;
    background:rgba(0,0,0,.5); font-size:9px; letter-spacing:.10em;
    opacity:.35; transition:all .15s ease; min-width:88px; text-align:center;
  }
  .slot span { color:#ffe066; margin-right:4px; font-weight:800; }
  .slot.available { opacity:.7; }
  .slot.active {
    opacity:1; border-color:#4ff0ff; background:rgba(79,240,255,.15);
    box-shadow:0 0 14px rgba(79,240,255,.45);
  }
  .slot.locked { opacity:.18; color:#666; }
  .slot.locked span { color:#444; }

  #combo {
    position:fixed; left:50%; top:26%; transform:translateX(-50%);
    z-index:7; pointer-events:none; text-align:center; opacity:0;
  }
  #combo.show { animation: comboAnim 1.4s ease-out forwards; }
  @keyframes comboAnim {
    0%   { opacity:0; transform:translateX(-50%) scale(1.4); }
    15%  { opacity:1; transform:translateX(-50%) scale(1); }
    75%  { opacity:1; }
    100% { opacity:0; transform:translateX(-50%) scale(1.05); }
  }
  #combo .t { font-size:clamp(22px,4vw,42px); font-weight:800; letter-spacing:.16em; color:#ffe066; text-shadow:0 0 24px #fa0; }
  #combo .s { font-size:12px; letter-spacing:.3em; color:#8ef7ff; opacity:.8; margin-top:3px; }

  #dmgnums { position:fixed; inset:0; z-index:6; pointer-events:none; overflow:hidden; }
  .dmgnum {
    position:absolute; font-size:14px; font-weight:800;
    color:#ffe066; text-shadow:0 0 10px #fa0, 0 1px 0 #000;
    transform: translate(-50%,-50%); pointer-events:none;
    animation: dmgFloat 0.85s ease-out forwards;
  }
  .dmgnum.crit { font-size:20px; color:#ff6b9d; text-shadow:0 0 14px #f39, 0 1px 0 #000; }
  @keyframes dmgFloat {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0.7); }
    15%  { opacity:1; transform:translate(-50%,-90%) scale(1.05); }
    80%  { opacity:1; transform:translate(-50%,-140%) scale(1); }
    100% { opacity:0; transform:translate(-50%,-180%) scale(0.9); }
  }

  #banner {
    position:fixed; left:0; right:0; top:26%; z-index:8; text-align:center;
    pointer-events:none; opacity:0;
  }
  #banner.show { animation: bannerAnim 2.6s ease-out forwards; }
  @keyframes bannerAnim {
    0%   { opacity:0; transform:scale(.9); }
    12%  { opacity:1; transform:scale(1); }
    78%  { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.06); }
  }
  #banner .bt { font-size:clamp(28px,6vw,54px); font-weight:800; letter-spacing:.16em; color:#9be7ff; text-shadow:0 0 30px #0af, 0 0 8px #0ff; }
  #banner.unlock .bt { color:#ffd166; text-shadow:0 0 34px #fa0, 0 0 10px #ff0; }
  #banner.boss .bt { color:#ff5577; text-shadow:0 0 34px #f24, 0 0 10px #f66; }
  #banner .bs { margin-top:6px; font-size:13px; letter-spacing:.28em; color:#ff8080; text-shadow:0 0 14px rgba(255,0,60,.8); }
  #banner.unlock .bs { color:#9be7ff; text-shadow:0 0 14px #0af; }
  #banner.boss .bs { color:#ff9f43; text-shadow:0 0 14px #f70; }

  .overlay {
    position:fixed; inset:0; z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:26px; text-align:center;
    background:radial-gradient(circle at 50% 45%, rgba(10,30,60,.65), rgba(2,4,10,.95));
    backdrop-filter:blur(6px);

  .overlay.show { display:flex; }
  .overlay h1 {
    font-size:clamp(28px,6.5vw,58px); letter-spacing:.14em; font-weight:800;
    color:#9be7ff; text-shadow:0 0 34px #0af, 0 0 10px #0ff;

  .overlay h1.red { color:#ff7a7a; text-shadow:0 0 34px #f00, 0 0 10px #f66; }
  .overlay h1.gold { color:#ffd166; text-shadow:0 0 40px #fa0, 0 0 12px #ffec8b; }

  .overlay p { max-width:640px; line-height:1.75; font-size:13.5px; opacity:.85; }
  .overlay .keys { font-size:12px; letter-spacing:.06em; opacity:.7; line-height:2; }
  .overlay .keys b {
    display:inline-block; min-width:22px; padding:2px 7px; margin:0 2px;
    border:1px solid rgba(140,230,255,.35); border-radius:4px;
    background:rgba(140,230,255,.08); color:#bdf3ff; font-weight:700;
  }
  .overlay ul { text-align:left; display:inline-block; font-size:12.5px; line-height:2; opacity:.8; list-style:none; }
  .overlay li .k { color:#ffd166; font-weight:800; margin-right:6px; }

  .btn-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button {
    padding:13px 30px; font:inherit; font-weight:800;
    letter-spacing:.14em; font-size:12px; color:#04141b; cursor:pointer;
    background:linear-gradient(180deg,#8ef6ff,#22b8e0);
    border:0; border-radius:999px;
    box-shadow:0 0 22px rgba(60,220,255,.45);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 0 36px rgba(60,220,255,.8); }
  button:active { transform:translateY(0); }
  button.ghost {
    background:transparent; color:#8ef7ff;
    border:1px solid rgba(120,230,255,.5); box-shadow:none;
  }
  button.ghost:hover { background:rgba(120,230,255,.1); box-shadow:none; }

  #draft .cards {
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin:6px 0 10px;
  }
  .card {
    width:240px; min-height:190px; padding:20px 18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(160deg, rgba(20,40,80,.75), rgba(8,16,36,.9));
    border:1px solid rgba(120,230,255,.4); border-radius:12px;
    box-shadow:0 0 24px rgba(60,180,255,.2);
    cursor:pointer; transition:all .15s ease; text-align:center;
  }
  .card:hover {
    transform:translateY(-4px);
    border-color:#4ff0ff; box-shadow:0 0 40px rgba(79,240,255,.55);
  }
  .card .icon { font-size:34px; }
  .card .nm { font-size:14px; font-weight:800; letter-spacing:.12em; color:#9be7ff; }
  .card .ds { font-size:11.5px; opacity:.75; line-height:1.6; }

  .setrow {
    display:flex; align-items:center; gap:14px; width:min(440px, 80vw);
    font-size:13px; letter-spacing:.06em;
  }
  .setrow label { min-width:140px; text-align:left; opacity:.8; }
  .setrow input[type=range] { flex:1; accent-color:#4ff0ff; }
  .setrow .val { min-width:52px; text-align:right; color:#ffe066; font-weight:700; }

  .statgrid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px 28px;
    font-size:13px; max-width:520px; text-align:left;
  }
  .statgrid .k { opacity:.6; letter-spacing:.08em; }
  .statgrid .v { color:#8ef7ff; font-weight:800; text-align:right; }

  #challenge {
    position:absolute; top:78px; left:50%; transform:translateX(-50%);
    padding:6px 14px; border:1px solid rgba(255,209,102,.4); border-radius:999px;
    background:rgba(20,10,0,.6); font-size:10px; letter-spacing:.18em;
    color:#ffd166; text-shadow:0 0 8px rgba(255,180,0,.6);
    display:none;
  }
  #challenge.show { display:block; }
</style>

<script type="module">
import * as THREE from 'three';

/* ============================================================ CONFIG ============================================================ */
const ARENA = 40, EYE_HEIGHT = 1.7, PLAYER_RADIUS = 0.5;
const MOVE_SPEED = 7.2, SPRINT_MULT = 1.55, JUMP_VEL = 7.2, GRAVITY = 22;
const MAX_HEALTH = 100;
const BASE_ENEMIES = 4, ENEMY_CAP = 40, SPAWN_INTERVAL = 2.0, MAX_LEVEL = 30;

/* ============================================================ SETTINGS / PERSISTENCE ============================================================ */
const settings = { sensitivity: 1.0, fov: 78, showFps: false };
try { Object.assign(settings, JSON.parse(localStorage.getItem('hs_settings') || '{}')); } catch(e){}
function saveSettings(){ try { localStorage.setItem('hs_settings', JSON.stringify(settings)); } catch(e){} }

const persistent = { totalXp:0, totalKills:0, bestCampaign:0, bestTimeAttack:9999, bestEndless:0, bestBossRush:0 };
try { Object.assign(persistent, JSON.parse(localStorage.getItem('hs_persistent') || '{}')); } catch(e){}
function savePersistent(){ try { localStorage.setItem('hs_persistent', JSON.stringify(persistent)); } catch(e){} }
function xpLevel(){ return Math.floor(Math.sqrt(persistent.totalXp / 50)) + 1; }

/* ============================================================ AUDIO ============================================================ */
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function blip(freq, dur, type='square', vol=0.05, slideTo=null, panX=null){
  const a = ac(); if(!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    let out = g;
    if(panX !== null){
      const p = a.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, panX));
      g.connect(p); out = p;
    }
    o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); out.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  } catch(e){}
}
let musicTimer = 0;
function updateMusic(dt, intensity){
  const a = ac(); if(!a) return;
  musicTimer -= dt;
  if(musicTimer <= 0){
    const base = intensity > 0.66 ? 110 : intensity > 0.33 ? 98 : 82;
    const notes = [0,3,7,10,12];
    const n = notes[Math.floor(Math.random() * notes.length)];
    const f = base * Math.pow(2, n / 12);
    blip(f, 1.6, 'triangle', 0.008 + intensity * 0.012);
    if(intensity > 0.5) blip(f * 2, 1.2, 'sine', 0.005);
    musicTimer = 1.6 + Math.random() * 0.9;
  }
}

/* ============================================================ TEXTURE HELPERS ============================================================ */
function makeCanvas(s){ const c=document.createElement('canvas'); c.width=c.height=s; return c; }
function rnd(a,b){ return a+Math.random()*(b-a); }

function makeGalaxySkyTexture(){
  const W=2048,H=1024,c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx = c.getContext('2d');
  const baseGrd = ctx.createLinearGradient(0,0,0,H);
  baseGrd.addColorStop(0.00,'#02030a'); baseGrd.addColorStop(0.25,'#070718');
  baseGrd.addColorStop(0.50,'#0a0a1e'); baseGrd.addColorStop(0.75,'#06061a');
  baseGrd.addColorStop(1.00,'#010208');
  ctx.fillStyle = baseGrd; ctx.fillRect(0,0,W,H);
  for(let i=0;i<14000;i++){
    const x=Math.random()*W, y=Math.random()*H;
    const r=Math.random()*0.75+0.15, b=0.20+Math.random()*0.55;
    const roll=Math.random(); let col;
    if(roll<0.72) col=`rgba(255,255,255,${b})`;
    else if(roll<0.84) col=`rgba(180,210,255,${b})`;
    else if(roll<0.93) col=`rgba(255,220,180,${b})`;
    else col=`rgba(230,180,255,${b})`;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.save();
  ctx.translate(W*0.52, H*0.52); ctx.rotate(-0.42);
  const bandLen=W*1.6, bandH=260;
  for(let i=0;i<60;i++){
    const t=i/60, yy=(t-0.5)*bandH;
    const alpha=0.018+Math.sin(t*Math.PI)*0.05;
    const grd=ctx.createLinearGradient(0,yy-16,0,yy+16);
    grd.addColorStop(0,'rgba(150,120,220,0)');
    grd.addColorStop(0.5,`rgba(160,130,230,${alpha})`);
    grd.addColorStop(1,'rgba(150,120,220,0)');
    ctx.fillStyle=grd; ctx.fillRect(-bandLen/2,yy-16,bandLen,32);
  }
  const coreGrd=ctx.createLinearGradient(0,-70,0,70);
  coreGrd.addColorStop(0,'rgba(200,190,255,0)');
  coreGrd.addColorStop(0.5,'rgba(230,225,255,0.16)');
  coreGrd.addColorStop(1,'rgba(200,190,255,0)');
  ctx.fillStyle=coreGrd; ctx.fillRect(-bandLen/2,-70,bandLen,140);
  for(let i=0;i<8000;i++){
    const x=(Math.random()-0.5)*bandLen, y=(Math.random()-0.5)*bandH;

function addBox(w,h,d,x,y,z,mat,solid=true,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = shadow; m.receiveShadow = true;
  layoutGroup.add(m); obstacleMeshes.push(m);
  if(solid) obstacles.push({ min:{x:x-w/2,z:z-d/2}, max:{x:x+w/2,z:z+d/2}, mesh:m });
  return m;
}
function addHazard(x,z,r,dps){
  const mesh = new THREE.Mesh(
    new THREE.CircleGeometry(r, 24),
    new THREE.MeshBasicMaterial({ color:0xff3a00, transparent:true, opacity:0.75 })
  );
  mesh.rotation.x = -Math.PI/2; mesh.position.set(x, 0.02, z);
  layoutGroup.add(mesh);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(r*0.94, r, 32),
    new THREE.MeshBasicMaterial({ color:0xffcc00, transparent:true, opacity:0.8, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2; ring.position.set(x, 0.03, z);
  layoutGroup.add(ring);
  const light = new THREE.PointLight(0xff5a00, 2.5, r*3, 2);
  light.position.set(x, 1.2, z);
  layoutGroup.add(light);
  hazardZones.push({ x, z, r, dps, mesh, ring, light, phase: Math.random()*10 });
}
function clearLayout(){
  while(layoutGroup.children.length){
    const o = layoutGroup.children.pop();
    o.geometry?.dispose?.();
    if(o.material && !Array.isArray(o.material)) o.material.dispose?.();
  }
  obstacleMeshes.length = 0;
  obstacles.length = 0;
  hazardZones.length = 0;
}
function buildLayout(variant){
  clearLayout();
  const W=2, H=7;
  addBox(ARENA*2+W, H, W, 0, H/2, -ARENA-W/2, wallMat);
  addBox(ARENA*2+W, H, W, 0, H/2,  ARENA+W/2, wallMat);
  addBox(W, H, ARENA*2+W, -ARENA-W/2, H/2, 0, wallMat);
  addBox(W, H, ARENA*2+W,  ARENA+W/2, H/2, 0, wallMat);

  if(variant === 'open'){
    for(let i=0;i<14;i++){
      const a=(i/14)*Math.PI*2 + Math.random()*0.4;
      const r=11+Math.random()*20;
      const x=Math.cos(a)*r, z=Math.sin(a)*r;
      if(Math.random()<0.45){
        const h=4+Math.random()*4;
        addBox(2.2, h, 2.2, x, h/2, z, pillarMat);
      } else {
        const w=2+Math.random()*2.4, d=2+Math.random()*2.4, h=1.6+Math.random()*1.6;
        addBox(w, h, d, x, h/2, z, crateMat);
      }
    }
  } else if(variant === 'maze'){
    const walls = [
      [-16, 0, 2, 24], [16, 0, 2, 24],
      [-8, -12, 20, 2], [8, 12, 20, 2],
      [-4, 0, 2, 16], [4, -8, 2, 16],
      [10, -4, 12, 2], [-10, 4, 12, 2]
    ];
    for(const [x,z,w,d] of walls) addBox(w, 4.5, d, x, 2.25, z, wallMat);
    for(let i=0;i<6;i++){
      const x=rnd(-18,18), z=rnd(-18,18);
      if(Math.abs(x)<24 && Math.abs(z)<24) addBox(2, 2, 2, x, 1, z, crateMat);
    }
  } else if(variant === 'hazard'){
    const pillars = [[-14,-14],[14,-14],[-14,14],[14,14],[0,0],[0,-18],[0,18]];
    for(const [x,z] of pillars) addBox(2.4, 6, 2.4, x, 3, z, pillarMat);
    addHazard(-9, 9, 4.5, 22);
    addHazard(9, -9, 4.5, 22);
    addHazard(0, 14, 4, 22);
    for(let i=0;i<5;i++){
      const x=rnd(-18,18), z=rnd(-18,18);
      let ok = true;
      for(const hz of hazardZones) if(Math.hypot(x-hz.x, z-hz.z) < hz.r + 2){ ok = false; break; }
      if(ok) addBox(rnd(1.5,2.5), rnd(1.5,2.5), rnd(1.5,2.5), x, 1.2, z, crateMat);
    }
  } else if(variant === 'tower'){
    addBox(6, 6, 6, 0, 3, 0, pillarMat);
    addBox(4, 0.4, 12, 0, 2, -7, crateMat);
    addBox(4, 0.4, 12, 0, 2, 7, crateMat);
    addBox(12, 0.4, 4, -7, 2, 0, crateMat);
    addBox(12, 0.4, 4, 7, 2, 0, crateMat);
    for(const [x,z] of [[-16,-16],[16,-16],[-16,16],[16,16]]) addBox(2, 5, 2, x, 2.5, z, pillarMat);
  }
}

  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);

  pos.add(dir.clone().multiplyScalar(0.6));

function explodeGrenade(g){
  g.exploded = true;
  const pos = g.mesh.position.clone();
  scene.remove(g.mesh);
  spawnBurst(pos, new THREE.MeshBasicMaterial({ color:0xffcc44 }), 20, 9);
  spawnBurst(pos, new THREE.MeshBasicMaterial({ color:0xff5522 }), 14, 7);
  const light = new THREE.PointLight(0xffaa44, 8, 18, 2);
  light.position.copy(pos); scene.add(light);
  setTimeout(()=> scene.remove(light), 180);
  blip(80, 0.4, 'sawtooth', 0.11, 30);
  const R = 6.5, DMG = 180;
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    const d = e.mesh.position.distanceTo(pos);
    if(d < R) damageEnemy(e, DMG * (1 - d/R), false);
  }
  const pd = player.pos.distanceTo(pos);
  if(pd < R){
    damagePlayer(6 * (1 - pd/R));
    const push = player.pos.clone().sub(pos).setY(0).normalize().multiplyScalar(8 * (1 - pd/R));
    player.vel.x += push.x; player.vel.z += push.z;
  }
}

function buildSentinelRig(){
  const root = new THREE.Group();
  const inner = new THREE.Group();
  inner.rotation.y = Math.PI;
  root.add(inner);

  const matArmor = new THREE.MeshStandardMaterial({ color:0x2a2f38, metalness:0.95, roughness:0.34 });
  const matDark  = new THREE.MeshStandardMaterial({ color:0x12161c, metalness:0.75, roughness:0.5  });
  const matJoint = new THREE.MeshStandardMaterial({ color:0x050608, metalness:0.35, roughness:0.85 });
  const matGlow  = new THREE.MeshStandardMaterial({ color:0xff2a1a, emissive:0xff2a1a, emissiveIntensity:5, metalness:0, roughness:0.25 });

  function part(geo, mat, x=0, y=0, z=0){
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x,y,z);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }

  const hips = new THREE.Group();
  hips.position.y = 0.97;
  inner.add(hips);
  hips.add(part(new THREE.BoxGeometry(0.36,0.22,0.24), matArmor));
  hips.add(part(new THREE.BoxGeometry(0.42,0.07,0.28), matDark, 0, 0.11, 0));
  hips.add(part(new THREE.BoxGeometry(0.10,0.10,0.10), matGlow, 0, 0, 0.14));

  const spine = new THREE.Group();
  spine.position.y = 0.12;
  hips.add(spine);
  spine.add(part(new THREE.BoxGeometry(0.28,0.16,0.20), matJoint, 0, 0.06, 0));
  spine.add(part(new THREE.BoxGeometry(0.44,0.34,0.26), matArmor, 0, 0.26, 0));
  spine.add(part(new THREE.BoxGeometry(0.48,0.20,0.31), matDark, 0, 0.32, -0.01));
  spine.add(part(new THREE.BoxGeometry(0.40,0.32,0.06), matArmor, 0, 0.26, 0.16));

  const core = part(new THREE.SphereGeometry(0.055,14,10), matGlow, 0, 0.32, -0.17);
  core.userData.isHead = true;
  spine.add(core);
  const coreLight = new THREE.PointLight(0xff2a1a, 1.0, 2.5, 2);
  coreLight.position.set(0, 0.32, -0.17);
  spine.add(coreLight);

  const neck = new THREE.Group();
  neck.position.y = 0.44;
  spine.add(neck);
  neck.add(part(new THREE.CylinderGeometry(0.075,0.09,0.10,10), matJoint, 0, 0.02, 0));

  const head = new THREE.Group();
  head.position.y = 0.12;
  neck.add(head);
  const headBox = part(new THREE.BoxGeometry(0.26,0.26,0.30), matArmor);
  headBox.userData.isHead = true;
  head.add(headBox);
  const crest = part(new THREE.BoxGeometry(0.10,0.10,0.34), matDark, 0, 0.15, 0.02);
  crest.userData.isHead = true;
  head.add(crest);
  const jaw = part(new THREE.BoxGeometry(0.26,0.09,0.06), matDark, 0, -0.05, -0.16);
  jaw.userData.isHead = true;
  head.add(jaw);
  const visor = part(new THREE.BoxGeometry(0.24,0.07,0.05), matGlow, 0, 0.03, -0.155);
  visor.userData.isHead = true;
  head.add(visor);
  const visorLight = new THREE.PointLight(0xff2a1a, 1.4, 2.5, 2);
  visorLight.position.set(0, 0.03, -0.25);
  head.add(visorLight);

  function buildArm(side){
    const shoulder = new THREE.Group();
    shoulder.position.set(side*0.28, 0.30, 0);
    spine.add(shoulder);
    const pad = part(new THREE.SphereGeometry(0.13,14,10), matArmor, side*0.02, 0.03, 0);
    pad.scale.set(1, 0.85, 1.05);
    shoulder.add(pad);
    shoulder.add(part(new THREE.CylinderGeometry(0.065,0.055,0.30,10), matDark, 0, -0.16, 0));
    const elbow = new THREE.Group();
    elbow.position.y = -0.32;
    shoulder.add(elbow);
    elbow.add(part(new THREE.SphereGeometry(0.072,12,8), matJoint));
    elbow.add(part(new THREE.CylinderGeometry(0.055,0.048,0.30,10), matArmor, 0, -0.16, 0));
    elbow.add(part(new THREE.BoxGeometry(0.11,0.14,0.09), matDark, 0, -0.13, -0.05));
    const hand = new THREE.Group();
    hand.position.y = -0.32;
    elbow.add(hand);
    hand.add(part(new THREE.BoxGeometry(0.095,0.13,0.07), matJoint, 0, -0.06, 0));
    for(let i=0;i<3;i++) hand.add(part(new THREE.BoxGeometry(0.022,0.085,0.022), matJoint, (i-1)*0.032, -0.165, -0.012));
    hand.add(part(new THREE.BoxGeometry(0.022,0.065,0.022), matJoint, side*0.052, -0.095, 0.015));
    return { shoulder, elbow, hand };
  }
  const armL = buildArm(-1);
  const armR = buildArm(1);

  const bladeGrp = new THREE.Group();
  bladeGrp.position.set(0, -0.10, -0.02);
  armR.hand.add(bladeGrp);
  bladeGrp.add(part(new THREE.BoxGeometry(0.045,0.72,0.11), matArmor, 0, -0.42, -0.03));
  bladeGrp.add(part(new THREE.BoxGeometry(0.13,0.05,0.15), matDark, 0, -0.06, -0.03));
  const tip = part(new THREE.ConeGeometry(0.045,0.16,4), matArmor, 0, -0.85, -0.03);
  tip.rotation.x = Math.PI;
  bladeGrp.add(tip);

  function buildLeg(side){
    const hip = new THREE.Group();
    hip.position.set(side*0.13, 0, 0);
    hips.add(hip);
    hip.add(part(new THREE.SphereGeometry(0.082,12,8), matJoint));
    hip.add(part(new THREE.CylinderGeometry(0.088,0.07,0.44,10), matArmor, 0, -0.22, 0));
    hip.add(part(new THREE.BoxGeometry(0.16,0.20,0.10), matDark, side*0.06, -0.20, -0.03));
    const knee = new THREE.Group();
    knee.position.y = -0.44;
    hip.add(knee);
    knee.add(part(new THREE.SphereGeometry(0.076,12,8), matJoint));
    knee.add(part(new THREE.BoxGeometry(0.14,0.13,0.07), matDark, 0, -0.02, -0.075));
    knee.add(part(new THREE.CylinderGeometry(0.066,0.05,0.44,10), matDark, 0, -0.22, 0));
    const ankle = new THREE.Group();
    ankle.position.y = -0.44;
    knee.add(ankle);
    ankle.add(part(new THREE.BoxGeometry(0.13,0.09,0.26), matArmor, 0, -0.045, -0.06));
    ankle.add(part(new THREE.BoxGeometry(0.115,0.06,0.09), matJoint, 0, -0.06, -0.20));
    ankle.add(part(new THREE.BoxGeometry(0.11,0.06,0.08), matJoint, 0, -0.06, 0.06));
    return { hip, knee, ankle };
  }
  const legL = buildLeg(-1);
  const legR = buildLeg(1);

  return { root, inner, matArmor, matDark, matJoint, matGlow,
           hips, spine, neck, head, armL, armR, legL, legR, bladeGrp,
           coreLight, visorLight };
}

const SENT_HIP_Y = 0.97;
function resetSentinelPose(r){
  r.hips.position.set(0, SENT_HIP_Y, 0);
  r.hips.rotation.set(0,0,0);
  r.spine.rotation.set(0,0,0);
  r.neck.rotation.set(0,0,0);
  r.head.rotation.set(0,0,0);
  for(const a of [r.armL, r.armR]){ a.shoulder.rotation.set(0,0,0); a.elbow.rotation.set(0,0,0); a.hand.rotation.set(0,0,0); }
  for(const l of [r.legL, r.legR]){ l.hip.rotation.set(0,0,0); l.knee.rotation.set(0,0,0); l.ankle.rotation.set(0,0,0); }
}
function poseSentinelIdle(r, t){
  const b = Math.sin(t * 1.5);
  r.hips.position.y = SENT_HIP_Y + b * 0.012;
  r.hips.rotation.z = Math.sin(t * 0.7) * 0.015;
  r.spine.rotation.x = 0.05 + b * 0.015;
  r.spine.rotation.y = Math.sin(t * 0.45) * 0.07;
  r.neck.rotation.y = Math.sin(t * 0.65) * 0.35;
  r.head.rotation.x = Math.sin(t * 0.9) * 0.05;
  r.armL.shoulder.rotation.x = 0.20 + b * 0.03;
  r.armL.shoulder.rotation.z = -0.17;
  r.armL.elbow.rotation.x = 0.55;
  r.armL.elbow.rotation.y = -0.22;
  r.armR.shoulder.rotation.x = 0.14 + b * 0.03;
  r.armR.shoulder.rotation.z = 0.17;
  r.armR.elbow.rotation.x = 0.42;
  r.armR.elbow.rotation.y = 0.22;
  r.legL.hip.rotation.z = -0.07; r.legR.hip.rotation.z = 0.07;
  r.legL.hip.rotation.x = -0.05; r.legR.hip.rotation.x = -0.05;
  r.legL.knee.rotation.x = -0.10; r.legR.knee.rotation.x = -0.10;
}
function poseSentinelWalk(r, t){
  const p = t * 3.2, s = Math.sin(p);
  r.hips.position.y = SENT_HIP_Y + Math.abs(Math.sin(p)) * 0.035 - 0.025;
  r.hips.rotation.y = s * 0.11;
  r.hips.rotation.z = s * 0.04;
  r.spine.rotation.x = 0.07;
  r.spine.rotation.y = -s * 0.11;
  r.neck.rotation.y = -s * 0.06;
  r.head.rotation.x = 0.02;
  r.legL.hip.rotation.x = s * 0.55; r.legR.hip.rotation.x = -s * 0.55;
  r.legL.knee.rotation.x = -0.14 - 0.80 * Math.max(0, -s);
  r.legR.knee.rotation.x = -0.14 - 0.80 * Math.max(0,  s);
  r.legL.ankle.rotation.x = -r.legL.hip.rotation.x * 0.35;
  r.legR.ankle.rotation.x = -r.legR.hip.rotation.x * 0.35;
  r.armL.shoulder.rotation.x = -s * 0.45 + 0.06;
  r.armR.shoulder.rotation.x =  s * 0.45 + 0.06;
  r.armL.shoulder.rotation.z = -0.12;
  r.armR.shoulder.rotation.z =  0.12;
  r.armL.elbow.rotation.x = 0.50 + Math.max(0, -s) * 0.30;
  r.armR.elbow.rotation.x = 0.42 + Math.max(0,  s) * 0.30;
}
function poseSentinelAttack(r, u){
  let armX, twist, lunge, kneeBend;
  if (u < 0.38){
    const e = Math.pow(u / 0.38, 2);
    armX = 0.15 - e * 1.35; twist = e * 0.55; lunge = -e * 0.04; kneeBend = e * 0.15;
  } else if (u < 0.62){
    const k = (u - 0.38) / 0.24;
    const e = 1 - Math.pow(1 - k, 3);
    armX = -1.20 + e * 2.75; twist = 0.55 - e * 0.95; lunge = -0.04 + e * 0.20; kneeBend = 0.15 - e * 0.20;
  } else {
    const k = (u - 0.62) / 0.38;
    const e = k * k;
    armX = 1.55 - e * 1.40; twist = -0.40 + e * 0.40; lunge = 0.16 - e * 0.16; kneeBend = -0.05 + e * 0.05;
  }
  const step = Math.max(0, lunge) * 3.0;
  const crouch = Math.abs(kneeBend) * 0.25;
  r.hips.position.y = SENT_HIP_Y - crouch + Math.abs(lunge) * 0.25;
  r.hips.position.z = lunge;
  r.hips.rotation.y = twist * 0.55;
  r.spine.rotation.x = 0.10 + Math.abs(lunge) * 0.5;
  r.spine.rotation.y = twist;
  r.neck.rotation.y = -twist * 0.4;
  r.head.rotation.x = 0.05;
  r.armR.shoulder.rotation.x = armX;
  r.armR.shoulder.rotation.z = 0.18 + Math.max(0, -armX) * 0.25;
  r.armR.elbow.rotation.x = Math.max(0.05, 0.9 - Math.abs(armX) * 0.55);
  r.armR.hand.rotation.x = -twist * 0.5;
  r.armL.shoulder.rotation.x = -armX * 0.35 + 0.25;
  r.armL.shoulder.rotation.z = -0.35 - Math.abs(twist) * 0.35;
  r.armL.elbow.rotation.x = 0.9;
  r.legL.hip.rotation.x = -0.30 + step * 0.5;
  r.legR.hip.rotation.x =  0.22 - step * 0.7;
  r.legR.knee.rotation.x = -0.35 - kneeBend;
  r.legL.knee.rotation.x = -0.20 + kneeBend * 0.4;
  r.legL.ankle.rotation.x = 0.18;
}

function makeEnemyMesh(typeDef, hue){

    map: TEX_ENEMY_ARMORS[typeDef] || TEX_ENEMY_ARMORS.basic,
    color: 0xffffff,
    emissive: new THREE.Color().setHSL(hue/360, 1, 0.28),
    emissiveIntensity: 0.5,
    roughness: 0.55, metalness: 0.75
  });
  const glowMat = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(hue/360, 1, 0.55) });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.0,1.10,0.55), armor);
  torso.position.y = 1.35; torso.castShadow = true; g.add(torso);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.85,0.70,0.14), EN_DARK_MAT);
  chest.position.set(0,1.45,0.32); g.add(chest);
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.14,0), glowMat);
  core.position.set(0,1.45,0.40); g.add(core); g.userData.core = core;

  const pl = new THREE.Mesh(new THREE.ConeGeometry(0.42,0.50,4), armor);
  pl.position.set(-0.65,1.85,0); pl.rotation.z = Math.PI/2; pl.rotation.y = Math.PI/4; pl.castShadow = true; g.add(pl);
  const pr = new THREE.Mesh(new THREE.ConeGeometry(0.42,0.50,4), armor);
  pr.position.set(0.65,1.85,0); pr.rotation.z = -Math.PI/2; pr.rotation.y = -Math.PI/4; pr.castShadow = true; g.add(pr);
  const sp1 = new THREE.Mesh(new THREE.ConeGeometry(0.075,0.32,4), glowMat);
  sp1.position.set(-0.65,2.18,0); g.add(sp1);
  const sp2 = new THREE.Mesh(new THREE.ConeGeometry(0.075,0.32,4), glowMat);
  sp2.position.set(0.65,2.18,0); g.add(sp2);

  const headGroup = new THREE.Group();
  const hb = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.42,0.55), armor);
  hb.castShadow = true; hb.userData.isHead = true; headGroup.add(hb);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.50,0.14,0.09), EN_DARK_MAT);
  visor.position.set(0,0.02,0.30); visor.userData.isHead = true; headGroup.add(visor);
  const e1 = new THREE.Mesh(new THREE.BoxGeometry(0.10,0.06,0.05), glowMat);
  e1.position.set(-0.14,0.02,0.35); e1.userData.isHead = true; headGroup.add(e1);
  const e2 = new THREE.Mesh(new THREE.BoxGeometry(0.10,0.06,0.05), glowMat);
  e2.position.set(0.14,0.02,0.35); e2.userData.isHead = true; headGroup.add(e2);
  const hs = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.22,4), glowMat);
  hs.position.set(0,0.34,0); hs.userData.isHead = true; headGroup.add(hs);
  headGroup.position.y = 2.18; g.add(headGroup); g.userData.head = headGroup;

  function buildArm(sideSign){
    const arm = new THREE.Group();
    const ua = new THREE.Mesh(new THREE.BoxGeometry(0.24,0.55,0.28), armor);
    ua.position.set(0,-0.27,0); ua.castShadow = true; arm.add(ua);
    const fa = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.55,0.24), EN_DARK_MAT);
    fa.position.set(0,-0.74,0); fa.castShadow = true; arm.add(fa);
    const gaunt = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.22,0.30), armor);
    gaunt.position.set(0,-1.08,0.05); gaunt.castShadow = true; arm.add(gaunt);
    return arm;
  }
  const la = buildArm(-1); la.position.set(-0.75,1.65,0); g.add(la); g.userData.leftArm = la;
  const ra = buildArm(1);  ra.position.set(0.75,1.65,0);  g.add(ra); g.userData.rightArm = ra;

  if(typeDef !== 'drone'){

      const leg = new THREE.Group();
      const th = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.65,0.32), armor);
      th.position.set(0,-0.33,0); th.castShadow = true; leg.add(th);
      const sh = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.65,0.28), EN_DARK_MAT);

function makeHealthBar(){
  const g = new THREE.Group();
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(1.3,0.14), EN_BAR_BG);
  bg.renderOrder = 998; g.add(bg);
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(1.24,0.10), EN_BAR_FILL.clone());
  fill.position.z = 0.001; fill.renderOrder = 999; g.add(fill);
  g.userData.fill = fill; g.userData.width = 1.24; return g;
}

function findSpawnPos(minDistFromPlayer = 15){
  for(let i=0;i<60;i++){
    const a = Math.random()*Math.PI*2, r = 17 + Math.random()*20;
    const x = THREE.MathUtils.clamp(player.pos.x + Math.cos(a)*r, -ARENA+3, ARENA-3);
    const z = THREE.MathUtils.clamp(player.pos.z + Math.sin(a)*r, -ARENA+3, ARENA-3);
    let ok = true;
    if(Math.hypot(x - player.pos.x, z - player.pos.z) < minDistFromPlayer) ok = false;
    if(ok) for(const o of obstacles){
      if(x > o.min.x-1.2 && x < o.max.x+1.2 && z > o.min.z-1.2 && z < o.max.z+1.2){ ok = false; break; }
    }
    if(ok) for(const hz of hazardZones){
      if(Math.hypot(x-hz.x, z-hz.z) < hz.r + 1.5){ ok = false; break; }
    }
    if(ok) return new THREE.Vector3(x,0,z);
  }
  const a = Math.random()*Math.PI*2;
  return new THREE.Vector3(Math.cos(a)*25, 0, Math.sin(a)*25);
}

function spawnEnemy(level, forcedType){
  let typeKey = forcedType;
  if(!typeKey){
    const allowed = ['basic'];
    if(level >= 2) allowed.push('rusher');
    if(level >= 4) allowed.push('shooter');
    if(level >= 7) allowed.push('tank');
    if(level >= 9) allowed.push('drone');
    typeKey = allowed[Math.floor(Math.random() * allowed.length)];
  }
  const def = ENEMY_TYPES[typeKey];
  const { group, mat, glowMat } = makeEnemyMesh(typeKey, def.hue);
  const p = findSpawnPos(); group.position.copy(p);

  const speed = def.speed * (1 + (level-1) * 0.05);
  const hp = Math.round(def.hp + (level-1) * def.hp * 0.12);
  const bar = makeHealthBar(); scene.add(bar);

  group.scale.setScalar(0.001 * def.scale);
  if(def.flying) group.position.y = 1.6;

  const e = {
    mesh: group, mat, glowMat, bar,
    hp, maxHp: hp, type: typeKey, speed,
    atkRange: def.atkRange, atkCd: def.atkCd, damage: def.damage,
    scale: def.scale, flying: def.flying, explode: def.explode, ranged: def.ranged,
    score: def.score, xp: def.xp,
    attackCd: 0.7 + Math.random() * 0.6,
    spawnT: 0, bob: Math.random() * Math.PI * 2, lunge: 0,
    alive: true, flash: 0, walkPhase: Math.random() * Math.PI * 2
  };
  group.userData.enemy = e;
  scene.add(group); enemies.push(e); updateEnemyBar(e);
  return e;
}

function spawnSentinel(level){
  const rig = buildSentinelRig();
  const p = findSpawnPos(20);
  rig.root.position.copy(p);

  const hp = 900 + level * 250;
  const scale = 1.5 + Math.min(level * 0.03, 0.5);
  rig.root.scale.setScalar(0.001);

  const bar = makeHealthBar(); scene.add(bar);

  const e = {
    mesh: rig.root, rig, bar,
    hp, maxHp: hp, type: 'sentinel', isBoss: true,
    speed: 2.6 + Math.min(level * 0.05, 1.2),
    atkRange: 3.4, atkCd: 1.3,
    damage: 26 + level * 1.2,
    scale, flying: false, explode: false, ranged: false,
    score: 3000 + level * 300, xp: 300 + level * 30,
    attackCd: 1.2, spawnT: 0,
    bob: Math.random() * Math.PI * 2, lunge: 0,
    alive: true, flash: 0, walkPhase: 0,
    sState: 'walk', sTime: 0, attackTriggered: false
  };
  rig.root.userData.enemy = e;
  scene.add(rig.root); enemies.push(e); updateEnemyBar(e);
  strobeActive = 3.0; strobeTimer = 0;
  showBanner('HOSTILE SENTINEL', `LEVEL ${level} · ELIMINATE THE BOSS`, 'boss');
  return e;
}

function updateEnemyBar(e){
  const frac = Math.max(0, e.hp/e.maxHp);
  e.bar.userData.fill.scale.x = frac;
  e.bar.userData.fill.position.x = -(1-frac)*e.bar.userData.width*0.5;
  if(frac < 0.35) e.bar.userData.fill.material.color.setHex(0xff8800);
  else e.bar.userData.fill.material.color.setHex(0xff2244);
}

function damageEnemy(e, amount, isCrit){
  if(!e.alive) return;
  e.hp -= amount;
  if(e.type === 'sentinel'){ e.rig.matGlow.emissiveIntensity = 12; }
  e.flash = 1;
  updateEnemyBar(e);
  if(e.hp <= 0){
    e.alive = false;
    const idx = enemies.indexOf(e);
    if(idx >= 0) enemies.splice(idx, 1);
    scene.remove(e.mesh); scene.remove(e.bar);

    const deathPos = e.mesh.position.clone().add(new THREE.Vector3(0, 1.2 * (e.scale || 1), 0));
    spawnBurst(deathPos, bloodMat, 20, 8);
    spawnBurst(deathPos, darkMat, 12, 6);
    blip(140, 0.2, 'sawtooth', 0.07, 40);

    if(e.explode){
      const R = 3.4, DMG = 22;
      const pos = e.mesh.position.clone();
      spawnBurst(pos.clone().setY(1), new THREE.MeshBasicMaterial({ color:0xffcc44 }), 10, 5);
      const light = new THREE.PointLight(0xffaa44, 4, 10, 2);
      light.position.copy(pos).setY(1); scene.add(light);
      setTimeout(()=> scene.remove(light), 150);
      const pd = player.pos.distanceTo(pos);
      if(pd < R) damagePlayer(DMG * (1 - pd/R));
    }

    const dropChance = { ammo: e.isBoss ? 1 : 0.32, health: e.isBoss ? 1 : (e.type === 'tank' ? 0.4 : 0.10) };
    if(Math.random() < dropChance.ammo) spawnAmmoPickup(e.mesh.position.clone());
    if(Math.random() < dropChance.health) spawnHealthPickup(e.mesh.position.clone());
    if(e.isBoss){
      spawnAmmoPickup(e.mesh.position.clone().add(new THREE.Vector3(1.5, 0, 0)));
      spawnAmmoPickup(e.mesh.position.clone().add(new THREE.Vector3(-1.5, 0, 0)));
      spawnHealthPickup(e.mesh.position.clone().add(new THREE.Vector3(0, 0, 1.5)));
      spawnHealthPickup(e.mesh.position.clone().add(new THREE.Vector3(0, 0, -1.5)));
    }

    state.kills++;
    state.combo++;
    state.comboTimer = 2.0;
    state.score += e.score * comboMult();
    state.xp += e.xp;
    persistent.totalKills++;
    persistent.totalXp += e.xp;

    if(e.isBoss){
      showBanner('SENTINEL DESTROYED', `+${e.score} SCORE`, 'unlock');
      bossbar.classList.remove('show');
      state.bossActive = false;
      state.bossPending = false;
      state.score += 500;
    }

    if(state.combo === 5) showCombo('KILLING SPREE', '×2 MULTIPLIER');
    if(state.combo === 10) showCombo('RAMPAGE', '×3 MULTIPLIER');
    if(state.combo === 20) showCombo('UNSTOPPABLE', '×4 MULTIPLIER');
    if(state.combo === 35) showCombo('GODLIKE', '×5 MULTIPLIER');

    updateHUD();
    savePersistent();
  } else {
    blip(900, 0.04, 'square', 0.025, 500);
  }
}

function comboMult(){
  if(state.combo >= 35) return 5;
  if(state.combo >= 20) return 4;
  if(state.combo >= 10) return 3;
  if(state.combo >= 5) return 2;
  return 1;
}

function flashHitMarker(isCrit){

function flashDamage(){

function showDamageDirection(worldPos){
  const toPlayer = camera.position.clone().sub(worldPos).setY(0).normalize();
  const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
  const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0,1,0)).normalize();
  const forwardDot = camDir.dot(toPlayer);
  const rightDot = camRight.dot(toPlayer);
  const angle = Math.atan2(rightDot, forwardDot);
  const R = Math.min(innerWidth, innerHeight) * 0.30;
  const cx = innerWidth/2 + Math.sin(angle) * R;
  const cy = innerHeight/2 - Math.cos(angle) * R;
  const el = document.createElement('div');
  el.className = 'dmg-arrow';
  el.style.left = cx + 'px';
  el.style.top  = cy + 'px';
  el.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
  dmgDirEl.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 250);
}

const keys = Object.create(null);
addEventListener('keydown', (e) => {
  if(e.repeat && !['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){
    if(!e.code.startsWith('Digit')) keys[e.code] = true;
    return;
  }
  keys[e.code] = true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyR','Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)) e.preventDefault();

  if(state.mode !== 'playing'){
    if(e.code === 'Escape' && state.mode === 'paused') resumeGame();
    return;
  }

  if(e.code === 'KeyR') startReload();
  if(e.code === 'KeyG') throwGrenade();
  if(e.code === 'KeyF') doMelee();
  if(e.code === 'Escape'){ pauseGame(); return; }

  const digitMap = { Digit1:'pistol', Digit2:'shotgun', Digit3:'ak47', Digit4:'railgun', Digit5:'machinegun' };
  if(digitMap[e.code]){
    const now = performance.now();
    if(lastKeyPressed === e.code && now - lastKeyPressTime < 350){
      if(lastWeaponType !== currentWeaponType) switchWeapon(lastWeaponType);
    } else {
      switchWeapon(digitMap[e.code]);
    }
    lastKeyPressed = e.code;
    lastKeyPressTime = now;
  }
  if(e.code === 'KeyQ') cycleWeapon(-1);
  if(e.code === 'KeyE') cycleWeapon(1);
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; firing = false; altFiring = false; });

const canvas = renderer.domElement;
canvas.addEventListener('mousedown', (e) => {
  if(state.mode !== 'playing') return;
  if(e.button === 0) firing = true;
  if(e.button === 2) altFiring = true;
});
addEventListener('mouseup', (e) => {
  if(e.button === 0) firing = false;
  if(e.button === 2) altFiring = false;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('mousemove', (e) => {
  if(document.pointerLockElement !== canvas) return;
  if(state.mode !== 'playing') return;
  yaw   -= e.movementX * lookSens();
  pitch -= e.movementY * lookSens();
  pitch = THREE.MathUtils.clamp(pitch, -Math.PI/2 + 0.02, Math.PI/2 - 0.02);
});
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  if(!locked && state.mode === 'playing') pauseGame();
});
function requestLock(){ const p = canvas.requestPointerLock(); if(p && p.catch) p.catch(() => {}); }

/* ============================================================ WEAPON SWITCHING ============================================================ */
function switchWeapon(type){
  if(!WEAPONS[type] || !WEAPONS[type].unlocked) return false;
  if(type === currentWeaponType) return false;
  if(switchCooldown > 0) return false;
  weaponModels[currentWeaponType].visible = false;
  lastWeaponType = currentWeaponType;
  currentWeaponType = type;
  weaponModels[currentWeaponType].visible = true;
  reloading = false; reloadTimer = 0;
  fireCooldown = Math.max(fireCooldown, 0.18); switchCooldown = 0.22;
  blip(560, 0.06, 'square', 0.03, 700); updateHUD(); return true;
}
function cycleWeapon(dir){
  const order = ['pistol','shotgun','ak47','railgun','machinegun'];
  const unlocked = order.filter(t => WEAPONS[t].unlocked);
  if(unlocked.length <= 1) return;
  let idx = unlocked.indexOf(currentWeaponType); if(idx < 0) idx = 0;
  idx = (idx + dir + unlocked.length) % unlocked.length;
  switchWeapon(unlocked[idx]);
}

function resetWeapons(){

  weaponModels[currentWeaponType].visible = false;

function startRun(mode){
  state.runMode = mode;
  state.mode = 'playing';
  state.level = 1;
  state.kills = 0; state.score = 0; state.xp = 0;
  state.combo = 0; state.comboTimer = 0;
  state.shotsFired = 0; state.shotsHit = 0;
  state.timeAttackTimer = 90;
  state.challenge = null; state.challengeComplete = false;
  state.bossActive = false; state.bossPending = false;
  state.startTime = performance.now();

  player.pos.set(0, EYE_HEIGHT, 8);
  player.vel.set(0,0,0);
  resetBuffs();
  player.health = maxHp();
  player.onGround = true;
  player.meleeCd = 0;

  yaw = Math.PI; pitch = 0;
  camera.rotation.set(pitch, yaw, 0);
  camera.fov = settings.fov;
  camera.updateProjectionMatrix();

  reloading=false; reloadTimer=0; fireCooldown=0;
  recoil=0; shake=0; firing=false; altFiring=false;
  switchCooldown=0; burstCounter=0;

  resetWeapons();

  for(const e of enemies){ scene.remove(e.mesh); scene.remove(e.bar); }
  enemies.length = 0;
  for(const p of parts) scene.remove(p.mesh); parts.length = 0;
  for(const t of tracers){ scene.remove(t.line); if(t.line.geometry) t.line.geometry.dispose?.(); if(t.line.material) t.line.material.dispose?.(); }
  tracers.length = 0;
  for(const d of decals) scene.remove(d.mesh); decals.length = 0;
  for(const s of shells) scene.remove(s.mesh); shells.length = 0;
  for(const g of grenades) scene.remove(g.mesh); grenades.length = 0;
  for(const p of projectiles) scene.remove(p.mesh); projectiles.length = 0;
  for(const p of pickups) scene.remove(p.mesh); pickups.length = 0;

  buildLayout(['open','maze','hazard','tower'][Math.floor(Math.random()*4)]);

  hideAllOverlays();
  requestLock(); ac();

  if(mode === 'bossrush') startBossRushLevel(1);
  else startLevel(1);
  updateHUD();
}
function pickChallenge(){
  const challenges = [
    { id:'noHit', text:'NO DAMAGE THIS LEVEL', check: () => state._levelTookDamage === false },
    { id:'acc',   text:'60%+ ACCURACY',        check: () => (state._levelShots > 0 ? state._levelHits / state._levelShots : 0) >= 0.6 },
    { id:'speed', text:'CLEAR UNDER 60s',      check: () => (performance.now() - state._levelStart) / 1000 < 60 },
