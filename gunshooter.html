/* ============================================================ COLLISION ============================================================ */
function resolveObstacles(pos, radius){
  const bound = ARENA - radius - 0.6;
  pos.x = THREE.MathUtils.clamp(pos.x, -bound, bound);
  pos.z = THREE.MathUtils.clamp(pos.z, -bound, bound);
  for(const o of obstacles){
    const minX = o.min.x - radius, maxX = o.max.x + radius;
    const minZ = o.min.z - radius, maxZ = o.max.z + radius;
    if(pos.x > minX && pos.x < maxX && pos.z > minZ && pos.z < maxZ){
      const dl = pos.x - minX, dr = maxX - pos.x;
      const db = pos.z - minZ, df = maxZ - pos.z;
      const m = Math.min(dl, dr, db, df);
      if(m === dl) pos.x = minX; else if(m === dr) pos.x = maxX;
      else if(m === db) pos.z = minZ; else pos.z = maxZ;
    }
  }
}

/* ============================================================ SHOOTING ============================================================ */
const raycaster = new THREE.Raycaster();

function startReload(){
  const wpn = WEAPONS[currentWeaponType];
  if(reloading || wpn.infinite) return;
  if(wpn.ammo === wpn.magSize) return;
  if(state.mode !== 'playing') return;
  reloading = true;
  reloadTimer = wpn.reloadTime * buffs.reloadMult;
  blip(300, 0.08, 'square', 0.03);
  setTimeout(() => blip(420, 0.08, 'square', 0.03), 260 * buffs.reloadMult);
  updateHUD();
}

function triggerPistolFireAnim(){
  const root = weaponModels.pistol;
  if(!root || !root.userData.rig) return;
  const st = root.userData.rig.state;
  st.slideOffset = 1.0;
  st.triggerPull = 1.0;
  st.hammerCock = 0.0;
  st.flashTime = 0.08;
}

function updatePistolAnim(dt){
  const root = weaponModels.pistol;
  if(!root || !root.userData.rig) return;
  const rig = root.userData.rig;
  const st = rig.state;

  st.triggerPull = Math.max(0, st.triggerPull - dt * 6);

  if (st.slideOffset > 0 && st.flashTime <= 0){
    st.slideOffset -= dt * 8;
    if (st.slideOffset < 0) st.slideOffset = 0;
  }
  if (st.flashTime > 0){
    st.flashTime -= dt;
    st.slideOffset = 1.0;
    if (st.flashTime < 0) st.flashTime = 0;
  }

  if (st.slideOffset > 0.3) st.hammerCock = Math.min(1, st.hammerCock + dt * 12);
  if (st.slideOffset < 0.1 && st.triggerPull < 0.1 && st.hammerCock > 0.9) st.hammerCock = 0;

  if (st.flashTime > 0){
    const a = st.flashTime / 0.08;
    rig.flash.material.opacity = a * 0.9;
    const s = 1 + (1 - a) * 0.4;
    rig.flash.scale.set(s, s, s);
    rig.flashLightP.intensity = a * 4;
  } else {
    rig.flash.material.opacity = 0;
    rig.flashLightP.intensity = 0;
  }

  if (reloading && currentWeaponType === 'pistol'){
    const wpn = WEAPONS.pistol;
    const reloadDur = wpn.reloadTime * buffs.reloadMult;
    const t = 1 - Math.max(0, reloadTimer / reloadDur);
    if (t < 0.4) st.magDrop = t / 0.4;
    else if (t < 0.8) st.magDrop = 1 - (t - 0.4) / 0.4;
    else st.magDrop = 0;
  } else {
    st.magDrop = Math.max(0, st.magDrop - dt * 3);
  }

  rig.magazine.position.set(-0.095 - st.magDrop * 0.05, -0.115 - st.magDrop * 0.30, 0);
  rig.magazine.rotation.z = st.magDrop * -0.5;

  rig.slide.position.x = -st.slideOffset * 0.055;
  rig.barrel.position.x = -st.slideOffset * 0.055 * 0.4;

  rig.trigger.rotation.z = -st.triggerPull * 0.55;
  rig.trigger.position.x = -0.020 + st.triggerPull * 0.008;

  rig.hammer.rotation.z = st.hammerCock * 0.7;

  rig.matGlowP.emissiveIntensity = 3.5 + Math.sin(performance.now() * 0.004) * 1.2;
}

function fireRay(origin, dir, damage, pierce, isRail, isCritCapable){
  raycaster.set(origin, dir);
  raycaster.far = 220;
  const targets = [];
  for(const e of enemies) targets.push(e.mesh);
  for(const m of obstacleMeshes) targets.push(m);
  const hits = raycaster.intersectObjects(targets, true);
  const endPoint = new THREE.Vector3();
  raycaster.ray.at(160, endPoint);

  let pierced = 0;
  let hitAny = false;
  let anyCrit = false;
  for(const hit of hits){
    let obj = hit.object, enemyObj = null, head = false;
    while(obj){
      if(obj.userData && obj.userData.isHead) head = true;
      if(obj.userData && obj.userData.enemy){ enemyObj = obj.userData.enemy; break; }
      obj = obj.parent;
    }
    endPoint.copy(hit.point);
    if(enemyObj && enemyObj.alive){
      let dmg = damage * buffs.damageMult;
      let isCrit = false;
      if(head){ dmg *= 3; isCrit = true; anyCrit = true; }
      if(isCritCapable && Math.random() < buffs.critChance){ dmg *= 2; isCrit = true; anyCrit = true; }
      damageEnemy(enemyObj, dmg, isCrit);
      showDamageNumber(hit.point.clone(), dmg, isCrit);
      hitAny = true;
      if(buffs.lifesteal > 0) player.health = Math.min(maxHp(), player.health + dmg * buffs.lifesteal);
      state._levelHits++;
      pierced++;
      if(!isRail && pierced >= 1) break;
      if(isRail && pierced >= (pierce || 1)) break;
    } else {
      const n = hit.face
        ? hit.face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld)).normalize()
        : new THREE.Vector3(0,1,0);
      spawnDecal(hit.point, n);
      spawnBurst(hit.point.clone(), sparkMat, 3, 2.2);
      break;
    }
  }
  return { endPoint, hitAny, anyCrit };
}

function shoot(){
  const wpn = WEAPONS[currentWeaponType];
  if(reloading || fireCooldown > 0) return;
  if(!wpn.infinite && wpn.ammo <= 0){ startReload(); return; }

  if(altFiring && wpn.altFire){ doAltFire(wpn); return; }

  if(currentWeaponType === 'pistol') triggerPistolFireAnim();

  if(!wpn.infinite) wpn.ammo--;
  fireCooldown = wpn.fireRate * buffs.fireRateMult;
  state.shotsFired += wpn.pellets;
  updateHUD();

  recoil += wpn.kick;
  shake = Math.min(shake + wpn.shakeAmt, 0.35);

  const wg = weaponModels[currentWeaponType];
  if(wg.userData.light) wg.userData.light.intensity = wpn.isRail ? 8 : 5.5;

  const s = wpn.sound;
  blip(s.f, s.dur, s.type, s.vol, s.to);

  const muzzleWorld = new THREE.Vector3();
  if(wg.userData.muzzle) wg.userData.muzzle.getWorldPosition(muzzleWorld);
  else wg.localToWorld(muzzleWorld.set(0,0,-1));

  const camRight = new THREE.Vector3(), camUp = new THREE.Vector3();
  camera.matrixWorld.extractBasis(camRight, camUp, new THREE.Vector3());

  if(wpn.isRail){
    const origin = camera.position.clone();
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    const res = fireRay(origin, dir, wpn.damage, wpn.pierce || 3, true, true);
    addBeam(muzzleWorld, res.endPoint);
    addTracer(muzzleWorld, res.endPoint, 0x66ffff, 0.14);
    if(res.hitAny) flashHitMarker(res.anyCrit);
    spawnShell(camera.position.clone().add(camRight.clone().multiplyScalar(0.3)).add(new THREE.Vector3(0,-0.2,0)), camRight);
    updateHUD();
    return;
  }

  for(let p=0;p<wpn.pellets;p++){
    let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    const sp = wpn.spread * buffs.spreadMult;
    if(sp > 0){
      const sx = (Math.random()-0.5) * sp * 2;
      const sy = (Math.random()-0.5) * sp * 2;
      dir.addScaledVector(camRight, sx).addScaledVector(camUp, sy).normalize();
    }
    const res = fireRay(camera.position.clone(), dir, wpn.damage, 1, false, true);
    if(res.hitAny) flashHitMarker(res.anyCrit);
    addTracer(muzzleWorld, res.endPoint);
  }

  if(currentWeaponType !== 'machinegun' && currentWeaponType !== 'pistol'){
    spawnShell(camera.position.clone().add(camRight.clone().multiplyScalar(0.35)).add(new THREE.Vector3(0,-0.2,0)), camRight);
  }
  updateHUD();
}

function doAltFire(wpn){
  const alt = wpn.altFire;
  if(!alt) return;
  if(!wpn.infinite && wpn.ammo <= 0){ startReload(); return; }

  if(alt.burst){
    if(burstCounter > 0) return;
    burstCounter = alt.burst;
    fireCooldown = 0.02;
    return;
  }

  if(!wpn.infinite) wpn.ammo--;
  fireCooldown = wpn.fireRate * 1.6 * buffs.fireRateMult;
  state.shotsFired += alt.pellets;
  updateHUD();
  recoil += alt.recoil;
  shake = Math.min(shake + alt.recoil * 1.4, 0.5);
  blip(wpn.sound.f * 0.65, wpn.sound.dur * 1.6, wpn.sound.type, wpn.sound.vol * 1.2, wpn.sound.to * 0.5);

  const wg = weaponModels[currentWeaponType];
  if(wg.userData.light) wg.userData.light.intensity = 8;
  const muzzleWorld = new THREE.Vector3();
  if(wg.userData.muzzle) wg.userData.muzzle.getWorldPosition(muzzleWorld);
  else wg.localToWorld(muzzleWorld.set(0,0,-1));

  const camRight = new THREE.Vector3(), camUp = new THREE.Vector3();
  camera.matrixWorld.extractBasis(camRight, camUp, new THREE.Vector3());

  for(let p=0;p<alt.pellets;p++){
    let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    if(alt.spread > 0){
      const sx = (Math.random()-0.5) * alt.spread * 2;
      const sy = (Math.random()-0.5) * alt.spread * 2;
      dir.addScaledVector(camRight, sx).addScaledVector(camUp, sy).normalize();
    }
    const res = fireRay(camera.position.clone(), dir, alt.damage, 2, false, true);
    if(res.hitAny) flashHitMarker(res.anyCrit);
    addTracer(muzzleWorld, res.endPoint, 0xff8844, 0.09);
  }
  updateHUD();
}

function doMelee(){
  if(player.meleeCd > 0) return;
  if(state.mode !== 'playing') return;
  player.meleeCd = 0.7;
  blip(220, 0.08, 'triangle', 0.05, 500);
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const MELEE_RANGE = 3.0, MELEE_DMG = 80;
  let hitAny = false;
  for(const e of enemies){
    if(!e.alive) continue;
    const toE = e.mesh.position.clone().sub(player.pos).setY(0);
    const d = toE.length();
    if(d > MELEE_RANGE + (e.scale || 1) * 0.5) continue;
    toE.normalize();
    if(toE.dot(fwd.setY(0).normalize()) < 0.3) continue;
    damageEnemy(e, MELEE_DMG, false);
    hitAny = true;
    const push = toE.multiplyScalar(6 / (e.isBoss ? 4 : 1));
    e.mesh.position.x += push.x; e.mesh.position.z += push.z;
  }
  if(hitAny) flashHitMarker(false);
  updateHUD();
}

/* ============================================================ PLAYER UPDATE ============================================================ */
const _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(), _wish = new THREE.Vector3();
function updatePlayer(dt){
  camera.rotation.set(pitch, yaw, 0);
  _fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  _rgt.set(Math.cos(yaw), 0, -Math.sin(yaw));
  _wish.set(0,0,0);
  if(keys['KeyW'] || keys['ArrowUp']) _wish.add(_fwd);
  if(keys['KeyS'] || keys['ArrowDown']) _wish.sub(_fwd);
  if(keys['KeyD'] || keys['ArrowRight']) _wish.add(_rgt);
  if(keys['KeyA'] || keys['ArrowLeft']) _wish.sub(_rgt);
  const sprinting = (keys['ShiftLeft'] || keys['ShiftRight']) && _wish.lengthSq() > 0;
  const targetSpeed = MOVE_SPEED * buffs.speedMult * (sprinting ? SPRINT_MULT : 1);
  if(_wish.lengthSq() > 0) _wish.normalize().multiplyScalar(targetSpeed);

  const accel = player.onGround ? 16 : 5;
  const k = 1 - Math.exp(-accel * dt);
  player.vel.x += (_wish.x - player.vel.x) * k;
  player.vel.z += (_wish.z - player.vel.z) * k;

  if(keys['Space'] && player.onGround){ player.vel.y = JUMP_VEL; player.onGround = false; blip(320, 0.07, 'sine', 0.03, 480); }
  player.vel.y -= GRAVITY * dt;

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  player.pos.y += player.vel.y * dt;
  if(player.pos.y <= EYE_HEIGHT){ player.pos.y = EYE_HEIGHT; player.vel.y = 0; player.onGround = true; }
  resolveObstacles(player.pos, PLAYER_RADIUS);

  for(const hz of hazardZones){
    const d = Math.hypot(player.pos.x - hz.x, player.pos.z - hz.z);
    if(d < hz.r){
      if(player.health > 0 && Math.random() < 0.6) damagePlayer(hz.dps * dt);
    }
  }

  const planar = Math.hypot(player.vel.x, player.vel.z);
  if(player.onGround && planar > 0.6) player.bobT += dt * planar * 1.35;
  else player.bobT += dt * 1.2;
  const bobAmp = Math.min(planar/MOVE_SPEED, 1.4) * 0.045;
  const bobY = Math.sin(player.bobT*2) * bobAmp;
  const bobX = Math.cos(player.bobT) * bobAmp * 0.6;
  camera.position.set(player.pos.x + bobX*0.35, player.pos.y + bobY, player.pos.z);

  walkSway += dt * (2 + planar * 1.2);
  const swayX = Math.cos(walkSway) * 0.012 * Math.min(planar/MOVE_SPEED, 1.4);
  const swayY = Math.sin(walkSway*2) * 0.010 * Math.min(planar/MOVE_SPEED, 1.4);

  recoil = THREE.MathUtils.damp(recoil, 0, 12, dt);
  shake  = THREE.MathUtils.damp(shake, 0, 8, dt);

  const base = WEAPON_BASE[currentWeaponType];
  const wg = weaponModels[currentWeaponType];
  wg.position.x = base.x + swayX + (reloading ? 0.05 : 0);
  wg.position.y = base.y + swayY - recoil * 0.6 + (reloading ? -0.14 : 0);
  wg.position.z = base.z + recoil * 0.35;
  wg.rotation.x = recoil * 2.2 + (reloading ? -0.55 : 0);
  wg.rotation.z = swayX * 3 + (reloading ? 0.4 : 0);

  if(shake > 0.001){
    camera.position.x += (Math.random()-0.5) * shake;
    camera.position.y += (Math.random()-0.5) * shake;
  }

  if(player.meleeCd > 0){
    player.meleeCd -= dt;
    if(player.meleeCd <= 0) updateHUD();
  }
  if(switchCooldown > 0) switchCooldown -= dt;
  if(fireCooldown > 0) fireCooldown -= dt;

  if(burstCounter > 0 && fireCooldown <= 0){
    burstCounter--;
    const wpn = WEAPONS[currentWeaponType];
    if(!wpn.infinite) wpn.ammo--;
    fireCooldown = 0.06;
    state.shotsFired += 1;
    const camRight = new THREE.Vector3(), camUp = new THREE.Vector3();
    camera.matrixWorld.extractBasis(camRight, camUp, new THREE.Vector3());
    let dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    const sp = wpn.spread * 0.6 * buffs.spreadMult;
    dir.addScaledVector(camRight, (Math.random()-0.5) * sp).addScaledVector(camUp, (Math.random()-0.5) * sp).normalize();
    const res = fireRay(camera.position.clone(), dir, wpn.damage * buffs.damageMult, 1, false, true);
    if(res.hitAny) flashHitMarker(res.anyCrit);
    const muzzleWorld = new THREE.Vector3();
    if(wg.userData.muzzle) wg.userData.muzzle.getWorldPosition(muzzleWorld);
    addTracer(muzzleWorld, res.endPoint);
    recoil += 0.03;
    blip(wpn.sound.f, wpn.sound.dur, wpn.sound.type, wpn.sound.vol, wpn.sound.to);
    updateHUD();
  }

  const wpn = WEAPONS[currentWeaponType];
  if(reloading){
    reloadTimer -= dt;
    if(reloadTimer <= 0){
      reloading = false; wpn.ammo = wpn.magSize;
      blip(520, 0.09, 'square', 0.04, 700); updateHUD();
    }
  } else if(firing && switchCooldown <= 0 && burstCounter <= 0){
    shoot();
  }

  updatePistolAnim(dt);

  for(const k2 in weaponModels){
    const l = weaponModels[k2].userData.light;
    if(l) l.intensity = THREE.MathUtils.damp(l.intensity, 0, 24, dt);
  }
}

/* ============================================================ SENTINEL AI ============================================================ */
function updateSentinel(e, dt, time){
  const rig = e.rig;
  const pp = player.pos;
  const dx = pp.x - e.mesh.position.x;
  const dz = pp.z - e.mesh.position.z;
  const dist = Math.hypot(dx, dz) || 0.0001;
  const nx = dx / dist, nz = dz / dist;

  e.mesh.rotation.y = Math.atan2(nx, nz);

  if(e.spawnT < 1){
    e.spawnT = Math.min(1, e.spawnT + dt * 1.6);
    const s = e.spawnT * e.spawnT * (3 - 2 * e.spawnT);
    e.mesh.scale.setScalar(s * e.scale);
  } else {
    e.mesh.scale.setScalar(e.scale);
  }

  if(e.attackCd > 0) e.attackCd -= dt;

  e.sTime += dt;
  if(e.sState === 'walk'){
    if(dist > e.atkRange * 0.85){
      const before = e.mesh.position.clone();
      e.mesh.position.x += nx * e.speed * dt;
      e.mesh.position.z += nz * e.speed * dt;
      resolveObstacles(e.mesh.position, 0.65 * e.scale);
      const moved = e.mesh.position.distanceTo(before);
      if(moved < e.speed * dt * 0.4){
        const side = Math.sin(time * 2) > 0 ? 1 : -1;
        e.mesh.position.x += -nz * side * e.speed * dt * 1.1;
        e.mesh.position.z +=  nx * side * e.speed * dt * 1.1;
        resolveObstacles(e.mesh.position, 0.65 * e.scale);
      }
    }
    if(dist < e.atkRange * 1.05 && e.attackCd <= 0){
      e.sState = 'attack';
      e.sTime = 0;
      e.attackTriggered = false;
      blip(180, 0.18, 'square', 0.05, 80);
    }
  } else if(e.sState === 'attack'){
    const u = e.sTime / 0.85;
    if(!e.attackTriggered && u >= 0.42 && u <= 0.66){
      if(dist < e.atkRange * 1.15){
        e.attackTriggered = true;
        damagePlayer(e.damage);
        showDamageDirection(e.mesh.position.clone());
        blip(70, 0.22, 'sawtooth', 0.09, 35);
        e.mesh.position.x += nx * 0.8;
        e.mesh.position.z += nz * 0.8;
      }
    }
    if(e.sTime >= 0.85){
      e.sState = 'walk';
      e.sTime = 0;
      e.attackCd = e.atkCd;
    }
  }

  resetSentinelPose(rig);
  if(e.sState === 'walk') poseSentinelWalk(rig, time + e.bob);
  else if(e.sState === 'attack') poseSentinelAttack(rig, Math.min(e.sTime / 0.85, 1));
  else poseSentinelIdle(rig, time + e.bob);

  if(e.flash > 0) e.flash = Math.max(0, e.flash - dt * 4);
  const pulseBase = 4.2 + Math.sin(time * 5.5) * 1.8;
  rig.matGlow.emissiveIntensity = pulseBase + e.flash * 8;
  rig.visorLight.intensity = 1.1 + Math.sin(time * 5.5) * 0.55 + e.flash * 3;
  rig.coreLight.intensity = 0.8 + Math.sin(time * 4.0) * 0.4 + e.flash * 3;

  const barY = 2.6 * e.scale;
  e.bar.position.set(e.mesh.position.x, e.mesh.position.y + barY, e.mesh.position.z);
  e.bar.lookAt(camera.position.x, e.bar.position.y, camera.position.z);

  bossfill.style.width = (e.hp / e.maxHp * 100) + '%';
  bossname.textContent = 'HOSTILE SENTINEL · LV ' + state.level;
  bossbar.classList.add('show');
}

/* ============================================================ ENEMY UPDATE ============================================================ */
function updateEnemies(dt, time){
  const pp = player.pos;
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i]; if(!e.alive) continue;

    if(e.type === 'sentinel'){
      updateSentinel(e, dt, time);
      continue;
    }

    if(e.spawnT < 1){
      e.spawnT = Math.min(1, e.spawnT + dt * 2.6);
      const t = e.spawnT;
      e.mesh.scale.setScalar(t * t * (3 - 2 * t) * e.scale);
    }
    if(e.flash > 0){
      e.flash = Math.max(0, e.flash - dt * 5);
      if(e.mat && e.mat.emissive){
        e.mat.emissiveIntensity = 0.5 + e.flash * 3.2;
        e.mat.emissive.setHSL(
          e.flash > 0.15 ? 0.98 : (e.type === 'rusher' ? 0.10 : e.type === 'shooter' ? 0.86 : e.type === 'tank' ? 0.75 : e.type === 'drone' ? 0.42 : 0),
          0.9, 0.2 + e.flash * 0.4
        );
      }
    }

    if(Math.random() < 0.02) e.bob += (Math.random() - 0.5) * 0.6;

    const dx = pp.x - e.mesh.position.x;
    const dz = pp.z - e.mesh.position.z;
    const dist = Math.hypot(dx, dz) || 0.0001;
    const nx = dx/dist, nz = dz/dist;

    e.attackCd = (e.attackCd || 0) - dt;

    if(e.ranged){
      const range = e.atkRange;
      if(e.attackCd <= 0 && dist < range && dist > 4){
        e.attackCd = e.atkCd;
        const from = e.mesh.position.clone().setY(1.6);
        spawnEnemyProjectile(from, player.pos.clone(), e.damage);
        blip(200, 0.1, 'square', 0.04, 100);
      }
    } else {
      if(dist < e.atkRange && e.attackCd <= 0){
        e.attackCd = e.atkCd;
        e.lunge = 1;
        damagePlayer(e.damage);
        blip(90, 0.18, 'sawtooth', 0.07, 45);
        showDamageDirection(e.mesh.position.clone());
      }
    }

    e.lunge = Math.max(0, (e.lunge || 0) - dt*3.5);

    const moving = (e.ranged ? dist > e.atkRange * 0.8 : dist > e.atkRange * 0.8);
    if(moving){
      const mx = nx * e.speed * dt, mz = nz * e.speed * dt;
      let sepx = 0, sepz = 0;
      for(let j=0;j<enemies.length;j++){
        if(j === i) continue;
        const o = enemies[j];
        if(!o.alive) continue;
        const ox = e.mesh.position.x - o.mesh.position.x;
        const oz = e.mesh.position.z - o.mesh.position.z;
        const d2 = ox*ox + oz*oz;
        const sepR = (e.scale + (o.scale || 1)) * 0.9;
        if(d2 < sepR*sepR && d2 > 0.0001){
          const d = Math.sqrt(d2);
          sepx += (ox/d)*(sepR - d)*0.35;
          sepz += (oz/d)*(sepR - d)*0.35;
        }
      }
      const before = e.mesh.position.clone();
      e.mesh.position.x += mx + sepx*dt*8;
      e.mesh.position.z += mz + sepz*dt*8;
      resolveObstacles(e.mesh.position, 0.55 * e.scale);
      const moved = e.mesh.position.distanceTo(before);
      if(moved < e.speed*dt*0.35){
        const side = (e.bob > Math.PI) ? 1 : -1;
        e.mesh.position.x += -nz * side * e.speed * dt * 0.9;
        e.mesh.position.z +=  nx * side * e.speed * dt * 0.9;
        resolveObstacles(e.mesh.position, 0.55 * e.scale);
      }
    }

    e.mesh.rotation.y = Math.atan2(nx, nz);

    if(e.flying){
      e.mesh.position.y = 1.6 + Math.sin(time*3 + e.bob) * 0.25;
      if(e.mesh.userData.rotor) e.mesh.userData.rotor.rotation.y += dt * 22;
    } else {
      e.mesh.position.y = Math.sin(time*7 + e.bob) * 0.06;
    }

    if(e.mesh.userData.head) e.mesh.userData.head.rotation.x = Math.sin(time*2 + e.bob) * 0.06;

    e.walkPhase = (e.walkPhase || 0) + dt * (moving ? e.speed*2.2 : 2);
    const armAmp = moving ? 0.55 : 0.08;
    if(e.mesh.userData.leftArm){
      e.mesh.userData.leftArm.rotation.x = Math.sin(e.walkPhase) * armAmp;
      e.mesh.userData.leftArm.rotation.z = 0.10 + Math.cos(e.walkPhase) * 0.05;
    }
    if(e.mesh.userData.rightArm){
      e.mesh.userData.rightArm.rotation.x = -Math.sin(e.walkPhase) * armAmp;
      e.mesh.userData.rightArm.rotation.z = -0.10 - Math.cos(e.walkPhase) * 0.05;
    }
    if(e.mesh.userData.leftLeg) e.mesh.userData.leftLeg.rotation.x = -Math.sin(e.walkPhase) * armAmp * 0.75;
    if(e.mesh.userData.rightLeg) e.mesh.userData.rightLeg.rotation.x = Math.sin(e.walkPhase) * armAmp * 0.75;

    const lungePush = (e.lunge || 0) * 0.28;
    e.mesh.position.x += nx * lungePush;
    e.mesh.position.z += nz * lungePush;

    if(e.mesh.userData.core){
      const pulse = 0.85 + Math.sin(time*6 + e.bob) * 0.15;
      e.mesh.userData.core.scale.setScalar(pulse);
    }

    const barY = e.flying ? 3.4 : 3.0 * (e.scale > 1.2 ? 1.15 : 1);
    e.bar.position.set(e.mesh.position.x, e.mesh.position.y + barY, e.mesh.position.z);
    e.bar.lookAt(camera.position.x, e.bar.position.y, camera.position.z);
  }
}

/* ============================================================ PICKUPS / SHELLS / GRENADES / PROJECTILES ============================================================ */
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i];
    p.life -= dt;
    p.bob += dt * 3;
    p.mesh.rotation.y += dt * 2.4;
    p.mesh.position.y = 0.5 + Math.sin(p.bob) * 0.15;
    if(p.life <= 0){ scene.remove(p.mesh); pickups.splice(i,1); continue; }
    const d = Math.hypot(player.pos.x - p.mesh.position.x, player.pos.z - p.mesh.position.z);
    if(d < 1.4){
      if(p.kind === 'ammo'){
        const wpn = WEAPONS[currentWeaponType];
        if(!wpn.infinite) wpn.ammo = Math.min(wpn.magSize, wpn.ammo + wpn.magSize);
        else {
          for(const k in WEAPONS){
            if(!WEAPONS[k].infinite){
              WEAPONS[k].ammo = Math.min(WEAPONS[k].magSize, WEAPONS[k].ammo + Math.ceil(WEAPONS[k].magSize * 0.5));
            }
          }
        }
        blip(880, 0.1, 'square', 0.045, 1200);
      } else {
        player.health = Math.min(maxHp(), player.health + 25);
        blip(660, 0.12, 'sine', 0.05, 990);
      }
      scene.remove(p.mesh); pickups.splice(i,1);
      updateHUD();
    }
  }
}
function updateShells(dt){
  for(let i=shells.length-1;i>=0;i--){
    const s = shells[i];
    s.life -= dt;
    if(s.life <= 0){ scene.remove(s.mesh); shells.splice(i,1); continue; }
    s.vel.y -= 22 * dt;
    s.mesh.position.addScaledVector(s.vel, dt);
    s.mesh.rotation.x += s.angVel.x * dt;
    s.mesh.rotation.y += s.angVel.y * dt;
    s.mesh.rotation.z += s.angVel.z * dt;
    if(s.mesh.position.y < 0.03){
      s.mesh.position.y = 0.03;
      s.vel.y *= -0.35; s.vel.x *= 0.6; s.vel.z *= 0.6;
      s.angVel.multiplyScalar(0.5);
      s.bounced++;
      if(s.bounced > 2) s.life = Math.min(s.life, 0.6);
    }
  }
}
function updateGrenades(dt){
  for(let i=grenades.length-1;i>=0;i--){
    const g = grenades[i];
    if(g.exploded){ grenades.splice(i,1); continue; }
    g.life -= dt;
    g.vel.y -= 22 * dt;
    g.mesh.position.addScaledVector(g.vel, dt);
    g.mesh.rotation.x += dt * 4; g.mesh.rotation.y += dt * 3;
    if(g.mesh.position.y < 0.18){
      g.mesh.position.y = 0.18;
      g.vel.y *= -0.5; g.vel.x *= 0.7; g.vel.z *= 0.7;
      g.bounces++;
    }
    resolveObstacles(g.mesh.position, 0.18);
    const blink = g.life < 0.7 ? (Math.floor(g.life * 20) % 2) : 0;
    g.mesh.material = blink ? grenadeBlinkMat : grenadeMat;
    if(g.life <= 0) explodeGrenade(g);
  }
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.life -= dt;
    if(p.life <= 0){ scene.remove(p.mesh); projectiles.splice(i,1); continue; }
    p.mesh.position.addScaledVector(p.vel, dt);
    const d = p.mesh.position.distanceTo(player.pos);
    if(d < 0.7){
      damagePlayer(p.dmg);
      showDamageDirection(p.mesh.position.clone());
      spawnBurst(p.mesh.position.clone(), new THREE.MeshBasicMaterial({ color:0xff5577 }), 5, 2);
      scene.remove(p.mesh); projectiles.splice(i,1);
      continue;
    }
    let hitWall = false;
    for(const o of obstacles){
      if(p.mesh.position.x > o.min.x && p.mesh.position.x < o.max.x &&
         p.mesh.position.z > o.min.z && p.mesh.position.z < o.max.z &&
         p.mesh.position.y < 7){
        hitWall = true; break;
      }
    }
    if(hitWall){
      spawnBurst(p.mesh.position.clone(), new THREE.MeshBasicMaterial({ color:0xff5577 }), 4, 2);
      scene.remove(p.mesh); projectiles.splice(i,1);
    }
  }
}

/* ============================================================ DAMAGE / EFFECTS ============================================================ */
function damagePlayer(amount){
  if(state.mode !== 'playing') return;
  player.health -= amount;
  shake = Math.min(shake + 0.16, 0.35);
  flashDamage();
  state._levelTookDamage = true;
  if(player.health <= 0){
    player.health = 0;
    updateHUD();
    endRun('YOU DIED');
  } else updateHUD();
}
function updateEffects(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    if(p.life <= 0){ scene.remove(p.mesh); parts.splice(i,1); continue; }
    p.vel.y -= 20 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    const s = Math.max(0.001, p.life/p.max);
    p.mesh.scale.setScalar(s * 0.9);
    p.mesh.rotation.x += dt * 6; p.mesh.rotation.y += dt * 4;
  }
  for(let i=tracers.length-1;i>=0;i--){
    const t = tracers[i]; t.life -= dt;
    if(t.life <= 0){
      scene.remove(t.line);
      if(t.line.geometry) t.line.geometry.dispose?.();
      if(t.line.material) t.line.material.dispose?.();
      tracers.splice(i,1);
    } else if(t.line.material) {
      t.line.material.opacity = (t.life/t.max) * 0.85;
    }
  }
  for(let i=decals.length-1;i>=0;i--){
    const d = decals[i]; d.life -= dt;
    if(d.life <= 0){ scene.remove(d.mesh); decals.splice(i,1); }
    else if(d.life < 2 && d.mesh.material) d.mesh.material.opacity = 0.85 * (d.life / 2);
  }
}

/* ============================================================ LEVEL LOGIC ============================================================ */
/* IMPORTANT: Weapon unlocks and drafts now happen in EVERY mode. */
function updateLevelLogic(dt){
  if(state.runMode === 'timeattack'){
    state.timeAttackTimer -= dt;
    if(state.timeAttackTimer <= 0){ endRun('TIME UP'); return; }
  }

  if(state.toSpawn > 0){
    state.spawnTimer -= dt;
    if(state.spawnTimer <= 0){
      spawnEnemy(state.level);
      state.toSpawn--;
      state.spawnTimer = Math.max(0.7, SPAWN_INTERVAL - state.level * 0.04);
      updateHUD();
    }
  }

  if(state.comboTimer > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0){ state.combo = 0; updateHUD(); }
  }
  if(state.combo > state._levelBestCombo) state._levelBestCombo = state.combo;

  if(strobeActive > 0){
    strobeActive -= dt;
    strobeTimer += dt;
    strobeLight.intensity = Math.max(0, Math.sin(strobeTimer * 14) * 6) * Math.min(1, strobeActive);
  } else strobeLight.intensity = 0;

  if(!state.betweenLevels && state.toSpawn === 0 && enemies.length === 0 && !state.bossPending && !state.bossActive){
    const clearedLevel = state.level;

    /* Challenge bonus */
    if(state.challenge && state.challenge.check()){
      state.challengeComplete = true;
      state.score += 500 * clearedLevel;
      showBanner('CHALLENGE COMPLETE', '+ BONUS SCORE', 'unlock');
    }
    challengeEl.classList.remove('show');

    /* Campaign victory */
    if(state.runMode === 'campaign' && clearedLevel >= MAX_LEVEL){
      state.score += 5000;
      victory();
      return;
    }

    /* Level clear bonus (mode-scaled) */
    const bonus = (state.runMode === 'bossrush' ? 2000 : 250) * clearedLevel;
    state.score += bonus;

    /* Draft every 3rd clear — now applies in ALL modes */
    if(clearedLevel % 3 === 0){
      openDraft();
      return;
    }

    /* Weapon unlock — now applies in ALL modes */
    const unlockType = UNLOCKS[clearedLevel];
    let didUnlock = false;
    if(unlockType && !WEAPONS[unlockType].unlocked){
      WEAPONS[unlockType].unlocked = true;
      WEAPONS[unlockType].ammo = WEAPONS[unlockType].magSize;
      const subLine = WEAPONS[unlockType].infinite
        ? `${WEAPONS[unlockType].name}  ·  ∞ INFINITE AMMO  ·  PRESS [${WEAPONS[unlockType].key}]`
        : `${WEAPONS[unlockType].name}  ·  PRESS [${WEAPONS[unlockType].key}] OR [Q]/[E] TO SWITCH`;
      showBanner('WEAPON UNLOCKED', subLine, 'unlock');
      weaponModels[currentWeaponType].visible = false;
      currentWeaponType = unlockType;
      weaponModels[currentWeaponType].visible = true;
      reloading = false; fireCooldown = 0.3;
      blip(660, 0.12, 'square', 0.06, 990);
      setTimeout(() => blip(880, 0.14, 'square', 0.06, 1320), 150);
      setTimeout(() => blip(1100, 0.18, 'square', 0.06, 1650), 300);
      didUnlock = true;
    } else {
      showBanner('SECTOR CLEAR', `+${bonus} BONUS  ·  PREPARING WAVE ${clearedLevel + 1}`);
      blip(660, 0.12, 'square', 0.05, 990);
      setTimeout(() => blip(880, 0.16, 'square', 0.05, 1320), 160);
    }

    state.betweenLevels = true;
    state.betweenTimer = didUnlock ? 3.4 : (state.runMode === 'bossrush' ? 3.0 : 2.6);
    updateHUD();
  }

  if(state.betweenLevels){
    state.betweenTimer -= dt;
    if(state.betweenTimer <= 0){
      if(state.runMode === 'bossrush') startBossRushLevel(state.level + 1);
      else startLevel(state.level + 1);
    }
  }
}

/* ============================================================ RESIZE / LOOP ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  skyDome.rotation.y += dt * 0.004;
  skyDomeInner.rotation.y += dt * 0.0028;

  for(const hz of hazardZones){
    hz.phase += dt * 2;
    const pulse = 0.6 + Math.sin(hz.phase) * 0.2;
    hz.ring.material.opacity = pulse;
    hz.light.intensity = 2 + Math.sin(hz.phase * 1.4) * 1;
  }

  const enemyIntensity = Math.min(1, enemies.length / 12);
  const hpIntensity = 1 - Math.min(1, player.health / maxHp());
  const intensity = state.mode === 'playing' ? Math.max(enemyIntensity, hpIntensity) : 0;
  if(state.mode === 'playing') updateMusic(dt, intensity);

  if(state.mode === 'playing'){
    updatePlayer(dt);
    updateEnemies(dt, t);
    updatePickups(dt);
    updateShells(dt);
    updateGrenades(dt);
    updateProjectiles(dt);
    updateLevelLogic(dt);
  } else if(state.mode === 'menu'){
    const a = t * 0.14;
    camera.position.set(Math.sin(a)*26, 14, Math.cos(a)*26);
    camera.lookAt(0, 1.5, 0);
  }

  for(const k in weaponModels) weaponModels[k].visible = (state.mode === 'playing') && (k === currentWeaponType);

  updateEffects(dt);

  if(state.runMode === 'timeattack' && state.mode === 'playing'){
    uiLevel.textContent = '⏱ ' + Math.max(0, Math.ceil(state.timeAttackTimer));
  }

  const targetFov = settings.fov + (hpIntensity > 0.7 ? 2 : 0);
  if(Math.abs(camera.fov - targetFov) > 0.05){
    camera.fov += (targetFov - camera.fov) * 0.1;
    camera.updateProjectionMatrix();
  }

  renderer.render(scene, camera);
}

/* ============================================================ BOOT ============================================================ */
camera.rotation.set(0, Math.PI, 0);
updateHUD();
openMenu();
tick();
</script>
